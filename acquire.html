<style>
.rm-wrap { max-width: 820px; margin: 0 auto; padding: 36px 20px 90px; }
.rm-hero { text-align: center; margin-bottom: 24px; }
.rm-hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -1px; color: var(--text); margin-bottom: 8px; }
.rm-hero p { font-size: 14px; color: var(--text2); max-width: 520px; margin: 0 auto; }

.rm-tabs { display: flex; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 6px; max-width: 460px; margin: 0 auto 22px; }
.rm-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: none; background: transparent; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.14s; }
.rm-tab svg { flex-shrink: 0; }
.rm-tab:hover { color: var(--text); }
.rm-tab.active { background: var(--bg2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.rm-tab.active svg { color: var(--accent); }

.rm-status { text-align: center; margin-bottom: 22px; min-height: 34px; }
.rm-status-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border2); }
.rm-status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); }
.rm-status-pill.user { color: var(--accent); background: var(--green-bg); border-color: rgba(0,194,122,0.25); }
.rm-status-pill.user .dot { background: var(--accent); }
.rm-status-pill.pro { color: #fff; background: var(--text); border-color: var(--text); }
.rm-status-pill.pro .dot { background: var(--accent); }

.rm-step { display: grid; grid-template-columns: 40px 1fr; gap: 16px; }
.rm-node-col { display: flex; flex-direction: column; align-items: center; }
.rm-node { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: var(--bg2); border: 2px solid var(--border2); color: var(--text3); flex-shrink: 0; transition: all 0.15s; }
.rm-node.accent { border-color: var(--accent); color: var(--accent); background: var(--green-bg); }
.rm-node.current { background: var(--accent); border-color: var(--accent); color: #181A20; box-shadow: 0 0 0 5px var(--green-bg); }
.rm-node.done { background: var(--green-bg); border-color: var(--accent); color: var(--accent); }
.rm-line { flex: 1; width: 2px; background: var(--border); margin: 4px 0; min-height: 16px; }
.rm-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 15px 18px; margin-bottom: 14px; box-shadow: var(--shadow); transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s; }
.rm-card:hover { transform: translateY(-2px); border-color: var(--border2); box-shadow: 0 6px 18px rgba(0,0,0,0.07); }
.rm-step.current .rm-card { border-color: var(--accent); box-shadow: 0 4px 18px rgba(0,194,122,0.12); }
.rm-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.rm-ico { width: 28px; height: 28px; border-radius: 8px; background: var(--bg3); display: inline-flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
.rm-card-head h3 { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; margin: 0; color: var(--text); }
.rm-here { margin-left: auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); background: var(--green-bg); border: 1px solid rgba(0,194,122,0.25); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.rm-done-tag { margin-left: auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.rm-card p { font-size: 13px; color: var(--text2); line-height: 1.55; margin: 0; }
.rm-cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; font-family: inherit; background: var(--accent); color: #181A20; transition: background 0.12s; }
.rm-cta:hover { background: var(--accent2); }
.rm-cta.ghost { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); }
.rm-cta.ghost:hover { border-color: var(--text); background: var(--bg3); }

.rm-finale { margin-top: 4px; margin-left: 56px; background: linear-gradient(135deg, rgba(0,194,122,0.08), rgba(0,168,104,0.05)); border: 1px solid rgba(0,194,122,0.22); border-radius: 14px; padding: 22px; text-align: center; }
.rm-finale h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.rm-finale p { font-size: 13px; color: var(--text2); margin-bottom: 14px; line-height: 1.5; }
.rm-finale .rm-cta { font-size: 14px; padding: 11px 22px; margin-top: 0; }

@media (max-width: 560px) { .rm-finale { margin-left: 0; } .rm-hero h1 { font-size: 26px; } .rm-tab { font-size: 13px; padding: 11px 8px; } }
</style>
</head>
<body>

<div id="navPlaceholder"></div>

<div class="rm-wrap">
  <div class="rm-hero">
    <h1 data-i18n="roadmap.title">Как работает Startup Market</h1>
    <p data-i18n="roadmap.sub">Два простых пути — выбери, хочешь ли ты купить прибыльный стартап или продать свой.</p>
  </div>

  <div class="rm-tabs">
    <button class="rm-tab active" id="tabBuy" onclick="setTab('buy')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span data-i18n="roadmap.tabBuy">Хочу купить</span>
    </button>
    <button class="rm-tab" id="tabSell" onclick="setTab('sell')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <span data-i18n="roadmap.tabSell">Хочу продать</span>
    </button>
  </div>

  <div class="rm-status" id="rmStatus"></div>
  <div id="roadmap"></div>
</div>

<footer>© 2026 Startup Market</footer>

<script>
applyLangToDoc();
document.getElementById('navPlaceholder').innerHTML = buildNavHTML('acquire');
initNavAuth();

let activeTab = 'buy';
const FROM = encodeURIComponent('/acquire.html');

const BUY_STEPS = [
  { ico: 'users',     t: 'b1t', d: 'b1d' },                                   // account — CTA set dynamically
  { ico: 'search',    t: 'b2t', d: 'b2d', cta: 'ctaBrowse',  href: '/' },
  { ico: 'handshake', t: 'b4t', d: 'b4d', cta: 'ctaBrowse',  href: '/' },
];
const SELL_STEPS = [
  { ico: 'dollar',    t: 's1t', d: 's1d' },
  { ico: 'tag',       t: 's2t', d: 's2d' },
  { ico: 'flag',      t: 's3t', d: 's3d' },
  { ico: 'handshake', t: 's4t', d: 's4d' },
];

function setTab(tab) {
  activeTab = tab;
  document.getElementById('tabBuy').classList.toggle('active', tab === 'buy');
  document.getElementById('tabSell').classList.toggle('active', tab === 'sell');
  render();
}

function nodeHTML(state, n) {
  if (state === 'done')    return '<span class="rm-node done">' + icon('check', { size: 18 }) + '</span>';
  if (state === 'current') return '<span class="rm-node current">' + n + '</span>';
  if (state === 'accent')  return '<span class="rm-node accent">' + n + '</span>';
  return '<span class="rm-node">' + n + '</span>';
}

function stepHTML(step, idx, total, state) {
  const isLast = idx === total - 1;
  let tag = '';
  if (state === 'current') tag = '<span class="rm-here">' + t('roadmap','youAreHere') + '</span>';
  else if (state === 'done') tag = '<span class="rm-done-tag">' + icon('check',{size:11}) + t('roadmap','done') + '</span>';
  let cta = '';
  if (step.href)    cta = '<a class="rm-cta'  + (state==='done'?' ghost':'') + '" href="' + step.href + '">' + t('roadmap', step.cta) + '</a>';
  else if (step.onclick) cta = '<button class="rm-cta" onclick="' + step.onclick + '">' + t('roadmap', step.cta) + '</button>';
  return '<div class="rm-step ' + state + '">' +
      '<div class="rm-node-col">' + nodeHTML(state, idx + 1) + (isLast ? '' : '<span class="rm-line"></span>') + '</div>' +
      '<div class="rm-card">' +
        '<div class="rm-card-head"><span class="rm-ico">' + icon(step.ico, { size: 16 }) + '</span><h3>' + t('roadmap', step.t) + '</h3>' + tag + '</div>' +
        '<p>' + t('roadmap', step.d) + '</p>' + cta +
      '</div>' +
    '</div>';
}

function renderStatus() {
  // Beta: open access — no tier/limit status pill is shown.
  const host = document.getElementById('rmStatus');
  if (host) host.innerHTML = '';
}

function renderBuy() {
  const a = window._access;
  let states;
  if (!a || !a.authenticated)        states = ['current', 'todo', 'todo'];
  else                               states = ['done', 'done', 'current'];

  // Step 1 (account) CTA depends on auth state
  const loggedIn = a && a.authenticated;
  const steps = BUY_STEPS.map((s, i) => {
    if (i === 0) return { ...s, cta: loggedIn ? 'ctaAccount' : 'ctaSignup', href: loggedIn ? '/dashboard.html' : ('/auth.html?from=' + FROM) };
    return s;
  });
  document.getElementById('roadmap').innerHTML = steps.map((s, i) => stepHTML(s, i, steps.length, states[i])).join('');
}

function renderSell() {
  const steps = SELL_STEPS.map(s => ({ ...s }));
  const timeline = steps.map((s, i) => stepHTML(s, i, steps.length, 'accent')).join('');
  const finale =
    '<div class="rm-finale">' +
      '<h3>' + t('roadmap','tabSell') + '</h3>' +
      '<p>' + t('roadmap','s1d') + '</p>' +
      '<button class="rm-cta" onclick="openSellModal()">' + t('roadmap','ctaList') + ' →</button>' +
    '</div>';
  document.getElementById('roadmap').innerHTML = timeline + finale;
}

function render() {
  renderStatus();
  if (activeTab === 'buy') renderBuy(); else renderSell();
}

// Re-render the buy path when auth/access info arrives (personalised status + steps)
window.addEventListener('navAuthUpdated', () => { if (activeTab === 'buy') render(); });

render();
</script>
</body>
</html>
