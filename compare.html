<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compare startups — Startup Market</title>
<meta name="description" content="Compare two verified startups side by side — MRR, revenue, growth, customers, asking price and revenue multiple, read directly from each startup's payment provider."/>
<link rel="canonical" href="https://startupmarket.tech/compare"/>
<meta name="robots" content="noindex,follow"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Startup Market"/>
<meta property="og:title" content="Compare two startups side by side"/>
<meta property="og:description" content="MRR, revenue, growth, asking price and multiple — two verified startups, head to head."/>
<meta property="og:image" content="https://startupmarket.tech/apple-touch-icon.png"/>
<meta name="twitter:card" content="summary"/>
<link rel="icon" href="/favicon.ico?v=2" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="/shared.css"/>
<script src="/auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/shared.js"></script>
<style>
.page-wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }
.cmp-back { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; text-decoration: none; margin: 4px 0 14px; transition: color 0.15s; }
.cmp-back:hover { color: var(--accent); }
.cmp-head { margin: 8px 0 18px; }
.cmp-head h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; color: var(--text); margin-bottom: 4px; }
.cmp-head .cmp-sub { font-size: 14px; color: var(--text2); }
.cmp-tools { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.cmp-tool { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text2); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: all 0.15s; }
.cmp-tool:hover { border-color: var(--border2); color: var(--text); }

/* ── versus grid ── */
.cmp-grid { display: grid; grid-template-columns: 1fr 116px 1fr; }
.cmp-cards { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px; align-items: stretch; }
.slot { min-width: 0; }
.slot.a { text-align: right; padding-right: 12px; }
.slot.b { text-align: left; padding-left: 12px; }
.slot-mid { display: flex; align-items: center; justify-content: center; }
.vs-badge { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border2); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: lowercase; }
.slot-name-row { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.slot.a .slot-name-row { justify-content: flex-end; }
.slot-logo { width: 34px; height: 34px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text2); flex-shrink: 0; overflow: hidden; }
.slot-logo img { width: 100%; height: 100%; object-fit: cover; }
.slot-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
.slot-name a { color: inherit; text-decoration: none; }
.slot-name a:hover { color: var(--accent); }
.slot-cat { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
.slot-foot { display: flex; gap: 6px; align-items: center; }
.slot.a .slot-foot { justify-content: flex-end; }
.badge-sale { font-size: 10px; font-weight: 600; color: #0B0E11; background: var(--accent); border-radius: 5px; padding: 2px 7px; }
.slot-link { font-size: 11px; color: var(--text2); text-decoration: none; display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; transition: all 0.15s; }
.slot-link:hover { border-color: var(--border2); color: var(--text); }
.slot-remove { background: none; border: none; color: var(--text3); cursor: pointer; padding: 2px; display: inline-flex; }
.slot-remove:hover { color: var(--red); }

/* ── search slot ── */
.slot-search { position: relative; }
.slot.b .slot-search { text-align: left; }
.search-box { width: 100%; box-sizing: border-box; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--text); font-family: inherit; }
.search-box:focus { outline: none; border-color: var(--accent); }
.search-pick-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.slot.a .search-pick-label { justify-content: flex-end; }
.search-results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.4); z-index: 40; overflow: hidden; text-align: left; max-height: 320px; overflow-y: auto; }
.search-row { display: flex; align-items: center; gap: 9px; padding: 8px 10px; cursor: pointer; }
.search-row:hover { background: var(--bg3); }
.search-row .sr-logo { width: 24px; height: 24px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text2); flex-shrink: 0; overflow: hidden; }
.search-row .sr-logo img { width: 100%; height: 100%; object-fit: cover; }
.search-row .sr-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-row .sr-rev { margin-left: auto; font-size: 11px; color: var(--text3); white-space: nowrap; }
.search-empty { padding: 12px; font-size: 12px; color: var(--text3); }
.empty-hint { font-size: 12px; color: var(--text3); margin-top: 10px; line-height: 1.5; }
.empty-hint a { color: var(--accent); text-decoration: none; }

/* ── metrics ── */
.cmp-metrics { margin-top: 12px; font-variant-numeric: tabular-nums; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.mrow { display: grid; grid-template-columns: 1fr 116px 1fr; align-items: center; padding: 11px 12px; border-bottom: 1px solid var(--border); }
.mrow:last-child { border-bottom: none; }
.mrow .mv { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .mv.a { text-align: right; padding-right: 12px; }
.mrow .mv.b { text-align: left; padding-left: 12px; }
.mrow .mv.win { color: var(--green); font-weight: 600; }
.mrow .mv.lose { color: var(--text3); }
.mrow .mlabel { text-align: center; font-size: 11px; color: var(--text3); line-height: 1.3; padding: 0 2px; }
.mv .winmark { font-size: 11px; }
.mv .gmv-tag { display: inline-block; font-size: 9px; font-weight: 600; color: var(--text3); border: 1px solid var(--border2); border-radius: 4px; padding: 0 4px; margin: 0 3px; vertical-align: 1px; }

/* ── verdict + spark ── */
.cmp-verdict { margin-top: 14px; display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text2); background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.cmp-verdict .vt { color: var(--accent); display: inline-flex; }
.cmp-verdict b { color: var(--text); font-weight: 600; }
.cmp-spark { margin-top: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px; }
.cmp-spark .sl-legend { display: flex; align-items: center; gap: 14px; margin-bottom: 9px; flex-wrap: wrap; }
.cmp-spark .sl-legend .sl-ttl { font-size: 11px; color: var(--text3); }
.cmp-spark .sl-legend .sl-key { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.cmp-spark .sl-key .sl-dash { width: 14px; height: 2px; display: inline-block; border-radius: 2px; }

.cmp-loading { text-align: center; padding: 50px 0; color: var(--text3); font-size: 13px; }
.skel { height: 14px; border-radius: 4px; background: var(--bg3); animation: loadpulse 1.4s ease-in-out infinite; }

@media (max-width: 600px) {
  .page-wrap { padding: 18px 14px 70px; }
  .cmp-head h1 { font-size: 24px; }
  .cmp-grid, .mrow { grid-template-columns: 1fr 60px 1fr; }
  .vs-badge { width: 30px; height: 30px; font-size: 10px; }
  .slot-name { font-size: 13px; max-width: 110px; }
  .mrow .mv { font-size: 12.5px; }
  .mrow .mv.a, .mrow .mv.b { padding: 0 5px; }
  .slot.a, .slot.b { padding: 0 5px; }
  .mrow .mlabel { font-size: 10px; }
}
</style>
</head>
<body>
<div id="navPlaceholder"></div>

<div class="page-wrap">
  <a class="cmp-back" href="/catalog" onclick="return cmpBack(event)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <span data-i18n="compare.back">Back to catalog</span>
  </a>
  <div class="cmp-head">
    <h1 data-i18n="compare.title">Compare</h1>
    <p class="cmp-sub" data-i18n="compare.sub">Two startups, side by side.</p>
    <div class="cmp-tools" id="cmpTools" style="display:none;">
      <span class="cmp-tool" id="swapBtn" onclick="swapSides()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 4 3 8 7 12"/><line x1="3" y1="8" x2="17" y2="8"/><polyline points="17 12 21 16 17 20"/><line x1="21" y1="16" x2="7" y2="16"/></svg>
        <span data-i18n="compare.swap">Swap sides</span>
      </span>
      <span class="cmp-tool" id="clearBtn" onclick="clearAll()">
        <span data-i18n="compare.clear">Clear</span>
      </span>
    </div>
  </div>

  <div id="cmpBody">
    <div class="cmp-loading" data-i18n="cache.loading">Loading…</div>
  </div>
</div>

<footer>© 2026 Startup Market</footer>

<script>
applyLangToDoc();
document.getElementById('navPlaceholder').innerHTML = buildNavHTML('catalog');
initNavAuth();

/* ── Stale-cache guards (see shared.js note): a returning visitor may hold an old
   cached shared.js. Install local fallbacks so this page never throws, and pass a
   literal English default to every compare-string lookup. ────────────────────── */
window.isGmvLike = window.isGmvLike || function (s) {
  const r = (s && s.revenue) || {};
  const mrr = Number(r.mrr || 0), subs = Number((s && s.activeSubscriptions) || 0);
  const cust = Number((s && s.customers) || 0), l30 = Number(r.last30Days || 0);
  if (mrr === 0 && subs === 0 && cust === 0 && l30 >= 100000) return true;
  if (mrr > 0 && cust === 0 && subs <= 2 && l30 >= mrr * 100 && l30 >= 25000) return true;
  return false;
};
function L(key, fb)      { try { return (typeof t === 'function' && t('compare', key)) || fb; } catch { return fb; } }
function LS(sec, key, fb){ try { return (typeof t === 'function' && t(sec, key)) || fb; } catch { return fb; } }
function money(v)        { try { return (typeof formatMoney === 'function') ? formatMoney(v) : ('$' + Math.round(v).toLocaleString()); } catch { return '—'; } }
function esc(s)          { try { return (typeof escHtml === 'function') ? escHtml(s) : String(s == null ? '' : s); } catch { return ''; } }

/* ── state ──────────────────────────────────────────────────────────────────── */
const state = {
  a: { slug: null, obj: null, loading: false, err: false },
  b: { slug: null, obj: null, loading: false, err: false },
};
let _allCache = null; // catalog snapshot from IndexedDB, for the second-startup search

function readUrl() {
  const p = new URLSearchParams(location.search);
  state.a.slug = (p.get('a') || '').trim() || null;
  state.b.slug = (p.get('b') || '').trim() || null;
}
function writeUrl() {
  const p = new URLSearchParams();
  if (state.a.slug) p.set('a', state.a.slug);
  if (state.b.slug) p.set('b', state.b.slug);
  const qs = p.toString();
  history.replaceState(null, '', qs ? ('/compare?' + qs) : '/compare');
}
function setTitle() {
  const an = state.a.obj && state.a.obj.name, bn = state.b.obj && state.b.obj.name;
  document.title = (an && bn) ? (an + ' vs ' + bn + ' — Startup Market')
                             : (L('title', 'Compare') + ' — Startup Market');
}

/* ── load one startup: local IndexedDB first (instant), then the public API for the
   freshest copy + detail-only fields like isMerchantOfRecord. ────────────────── */
async function loadSlot(side) {
  const slot = state[side];
  if (!slot.slug) { slot.obj = null; slot.loading = false; slot.err = false; return; }
  slot.loading = true; slot.err = false;
  try {
    if (typeof idbGetOne === 'function') {
      const local = await idbGetOne(slot.slug);
      if (local && local.slug) { slot.obj = local; render(); }
    }
  } catch {}
  try {
    const res = await fetch('/api/startup?slug=' + encodeURIComponent(slot.slug) + '&lang=' + encodeURIComponent(getLang()));
    if (res.ok) {
      const j = await res.json();
      if (j && j.data && j.data.slug) slot.obj = j.data;
    }
  } catch {}
  slot.loading = false;
  if (!slot.obj) slot.err = true;
  render();
}

/* ── metric definitions ─────────────────────────────────────────────────────────
   dir: 'high' bigger wins · 'low' smaller wins · 'none' shown but not scored.
   zeroOk: a 0 value is real data (growth/margin), not "missing". ─────────────── */
function rev(s, k) { return (s && s.revenue && Number(s.revenue[k])) || 0; }
function pct(v)    { v = Number(v); return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function gmvNature(s) { return !!(s && (s.isMerchantOfRecord || window.isGmvLike(s))); }

const METRICS = [
  { key:'price',   dir:'none', label:()=>LS('startupPage','price','Asking price'),
    val:s=>s.onSale ? (Number(s.askingPrice)||0) : 0, fmt:v=>v>0?money(v):'—' },
  { key:'mrr',     dir:'high', label:()=>LS('startupPage','mrr','MRR'),
    val:s=>rev(s,'mrr'), fmt:v=>money(v) },
  { key:'growth',  dir:'high', zeroOk:true, label:()=>LS('startupPage','growth','30-day growth'),
    val:s=>s.growth30d==null?null:Number(s.growth30d), fmt:v=>pct(v) },
  { key:'rev30',   dir:'high', gmv:true, label:isGmv=>isGmv?LS('startupPage','gmv30','GMV (30 days)'):LS('startupPage','rev30','Revenue (30 days)'),
    val:s=>rev(s,'last30Days'), fmt:v=>money(v) },
  { key:'total',   dir:'high', gmv:true, label:isGmv=>isGmv?LS('startupPage','gmv','GMV'):LS('startupPage','totalRev','Total revenue'),
    val:s=>rev(s,'total'), fmt:v=>money(v) },
  { key:'customers', dir:'high', label:()=>LS('startupPage','customers','Customers'),
    val:s=>Number(s.customers)||0, fmt:v=>Number(v).toLocaleString() },
  { key:'subs',    dir:'high', label:()=>LS('startupPage','subs','Active subscriptions'),
    val:s=>Number(s.activeSubscriptions)||0, fmt:v=>Number(v).toLocaleString() },
  { key:'multiple', dir:'low', label:()=>LS('startupPage','multiple','Revenue multiple'),
    val:s=>(s.onSale&&Number(s.multiple))?Number(s.multiple):0, fmt:v=>v>0?(v.toFixed(1)+'×'):'—', good:'betterValue' },
  { key:'margin',  dir:'high', zeroOk:true, label:()=>LS('startupPage','margin','Profit margin'),
    val:s=>s.profitMarginLast30Days==null?null:Number(s.profitMarginLast30Days), fmt:v=>Math.round(v)+'%' },
  { key:'visitors', dir:'high', label:()=>LS('startupPage','visitors','Visitors (30d)'),
    val:s=>Number(s.visitorsLast30Days)||0, fmt:v=>Number(v).toLocaleString() },
];

function present(m, v) {
  if (v == null || isNaN(v)) return false;
  return m.zeroOk ? true : v > 0;
}
// Effective direction for a row: when exactly one side is GMV-natured we can't fairly
// rank revenue against gross volume, so the row is shown but not scored.
function rowDir(m, a, b) {
  if (m.dir === 'none') return 'none';
  if (m.gmv && (gmvNature(a) !== gmvNature(b))) return 'none';
  return m.dir;
}

/* ── render ─────────────────────────────────────────────────────────────────── */
function initials(name) {
  return (String(name||'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()) || '?';
}
function logoHTML(s, cls) {
  const init = initials(s.name);
  const inner = s.icon ? '<img src="'+esc(s.icon)+'" loading="lazy" onerror="this.parentElement.textContent=\''+init+'\'"/>' : init;
  return '<span class="'+cls+'">'+inner+'</span>';
}
function slotHeaderHTML(side) {
  const s = state[side].obj;
  const sale = s.onSale ? '<span class="badge-sale">'+esc(LS('startupPage','forSale','For sale'))+'</span>' : '';
  const link = '<a class="slot-link" href="/startup/'+esc(s.slug)+'.html">'+esc(L('open','Open'))+
    ' <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></a>';
  const rm = '<button class="slot-remove" title="'+esc(L('removeTip','Remove'))+'" onclick="removeSide(\''+side+'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
  const name = '<span class="slot-name"><a href="/startup/'+esc(s.slug)+'.html">'+esc(s.name)+'</a></span>';
  const logo = logoHTML(s, 'slot-logo');
  const nameRow = side === 'a' ? (name + logo) : (logo + name);
  const foot = side === 'a' ? (rm + link + sale) : (sale + link + rm);
  return '<div class="slot '+side+'">'+
    '<div class="slot-name-row">'+nameRow+'</div>'+
    (s.category ? '<div class="slot-cat">'+esc(s.category)+'</div>' : '<div class="slot-cat">—</div>')+
    '<div class="slot-foot">'+foot+'</div>'+
  '</div>';
}
function slotSkeletonHTML(side) {
  return '<div class="slot '+side+'">'+
    '<div class="slot-name-row" style="'+(side==='a'?'justify-content:flex-end;':'')+'"><span class="slot-logo"></span><span class="skel" style="width:90px;"></span></div>'+
    '<div class="skel" style="width:60px;height:11px;margin:'+(side==='a'?'0 0 0 auto':'0')+';"></div>'+
  '</div>';
}
function slotSearchHTML(side) {
  const err = state[side].err ? '<div class="empty-hint">'+esc(L('loadErr','Could not load this startup.'))+'</div>' : '';
  return '<div class="slot '+side+'"><div class="slot-search">'+
    '<div class="search-pick-label">'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>'+
      esc(L('pick','Choose a second startup'))+'</div>'+
    '<input class="search-box" type="text" autocomplete="off" data-side="'+side+'" oninput="onSearch(this)" onfocus="onSearch(this)" placeholder="'+esc(L('searchPh','Search by name…'))+'"/>'+
    '<div class="search-results" data-for="'+side+'" style="display:none;"></div>'+
    err +
  '</div></div>';
}
function colHTML(side) {
  const slot = state[side];
  if (slot.obj) return slotHeaderHTML(side);
  if (slot.slug && slot.loading) return slotSkeletonHTML(side);
  return slotSearchHTML(side);
}

function metricsHTML() {
  const a = state.a.obj, b = state.b.obj;
  let rows = '', winA = 0, winB = 0, scored = 0;
  for (const m of METRICS) {
    const va = m.val(a), vb = m.val(b);
    const pa = present(m, va), pb = present(m, vb);
    if (!pa && !pb) continue; // neither side has this metric — skip the row entirely
    const dir = rowDir(m, a, b);
    let clsA = 'mv a', clsB = 'mv b', markA = '', markB = '';
    if (dir !== 'none' && pa && pb && va !== vb) {
      const aWins = dir === 'high' ? va > vb : va < vb;
      scored++;
      if (aWins) { winA++; clsA += ' win'; clsB += ' lose'; markA = ' <span class="winmark">'+(m.good==='betterValue'?'':'↑')+'</span>'; }
      else       { winB++; clsB += ' win'; clsA += ' lose'; markB = ' <span class="winmark">'+(m.good==='betterValue'?'':'↑')+'</span>'; }
    }
    const bothGmv = !!m.gmv && gmvNature(a) && gmvNature(b);
    const label = m.label.length ? m.label(bothGmv) : m.label();
    const gtagA = (m.gmv && gmvNature(a) && pa) ? '<span class="gmv-tag">GMV</span>' : '';
    const gtagB = (m.gmv && gmvNature(b) && pb) ? '<span class="gmv-tag">GMV</span>' : '';
    const cellA = pa ? (m.fmt(va) + (clsA.includes('win')?markA:'')) : '—';
    const cellB = pb ? (m.fmt(vb) + (clsB.includes('win')?markB:'')) : '—';
    rows += '<div class="mrow">'+
      '<div class="'+clsA+'">'+gtagA+cellA+'</div>'+
      '<div class="mlabel">'+esc(label)+'</div>'+
      '<div class="'+clsB+'">'+cellB+gtagB+'</div>'+
    '</div>';
  }
  return { rows, winA, winB, scored };
}

function verdictHTML(winA, winB, scored) {
  const a = state.a.obj, b = state.b.obj;
  let txt;
  if (scored === 0) txt = '<b>'+esc(a.name)+'</b> · <b>'+esc(b.name)+'</b>';
  else if (winA === winB) txt = esc(L('tie','Evenly matched'));
  else {
    const win = winA > winB ? a : b, n = Math.max(winA, winB);
    txt = L('leads','{name} leads on {n} of {m}')
      .replace('{name}', '<b>'+esc(win.name)+'</b>').replace('{n}', n).replace('{m}', scored);
  }
  return '<div class="cmp-verdict"><span class="vt">'+
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4zM5 9a3 3 0 0 1 0-5M19 9a3 3 0 0 0 0-5"/></svg>'+
    '</span><span>'+txt+'</span></div>';
}

function render() {
  const body = document.getElementById('cmpBody');
  const bothPicked = state.a.obj && state.b.obj;
  document.getElementById('cmpTools').style.display = bothPicked ? 'flex' : 'none';
  setTitle();

  let html = '<div class="cmp-grid cmp-cards">'+
    colHTML('a')+
    '<div class="slot-mid"><span class="vs-badge">'+esc(L('vs','vs'))+'</span></div>'+
    colHTML('b')+
  '</div>';

  if (bothPicked) {
    const m = metricsHTML();
    html += '<div class="cmp-metrics">'+m.rows+'</div>';
    html += verdictHTML(m.winA, m.winB, m.scored);
    html += '<div class="cmp-spark" id="cmpSpark" style="display:none;"></div>';
  } else if (!state.a.slug && !state.b.slug && (!_allCache || !_allCache.length)) {
    html += '<div class="empty-hint">'+esc(L('emptyHint','Open the catalog and tap Compare on any two startups.'))+
      ' <a href="/catalog">'+esc(L('browseCatalog','Browse catalog'))+'</a></div>';
  }

  body.innerHTML = html;
  if (bothPicked) loadSpark();
}

/* ── second-startup search (local catalog cache) ────────────────────────────── */
async function ensureAll() {
  if (_allCache) return _allCache;
  try { _allCache = (typeof idbGetAll === 'function') ? (await idbGetAll()) : []; }
  catch { _allCache = []; }
  return _allCache;
}
let _searchTimer = null;
async function onSearch(input) {
  const side = input.getAttribute('data-side');
  const box = document.querySelector('.search-results[data-for="'+side+'"]');
  if (!box) return;
  const all = await ensureAll();
  const q = input.value.trim().toLowerCase();
  const other = side === 'a' ? state.b.slug : state.a.slug;
  let list = all.filter(s => s && s.slug && s.slug !== other);
  if (q) list = list.filter(s => (s.name||'').toLowerCase().includes(q) || (s.slug||'').toLowerCase().includes(q));
  list.sort((x, y) => (Number(y.onSale)||0) - (Number(x.onSale)||0) || rev(y,'last30Days') - rev(x,'last30Days'));
  list = list.slice(0, 8);
  if (!all.length) { box.style.display = 'none'; return; }
  if (!list.length) { box.innerHTML = '<div class="search-empty">'+esc(L('noMatch','No matches found'))+'</div>'; box.style.display = 'block'; return; }
  box.innerHTML = list.map(s =>
    '<div class="search-row" onclick="pickSide(\''+side+'\',\''+esc(s.slug)+'\')">'+
      logoHTML(s, 'sr-logo')+
      '<span class="sr-name">'+esc(s.name)+'</span>'+
      '<span class="sr-rev">'+money(rev(s,'last30Days'))+'</span>'+
    '</div>').join('');
  box.style.display = 'block';
}
document.addEventListener('click', e => {
  if (e.target.closest && (e.target.closest('.search-results') || e.target.closest('.search-box'))) return;
  document.querySelectorAll('.search-results').forEach(b => b.style.display = 'none');
});

function pickSide(side, slug) {
  state[side].slug = slug; state[side].obj = null; state[side].err = false;
  writeUrl(); render(); loadSlot(side);
}
function removeSide(side) {
  state[side].slug = null; state[side].obj = null; state[side].err = false;
  writeUrl(); render();
}
function swapSides() {
  const a = state.a; state.a = state.b; state.b = a;
  writeUrl(); render();
}
function clearAll() {
  state.a = { slug:null, obj:null, loading:false, err:false };
  state.b = { slug:null, obj:null, loading:false, err:false };
  try { localStorage.removeItem('sm_compare'); } catch {}
  writeUrl(); render();
}
// Back arrow: return to the previous same-origin page (the startup/catalog the user
// came from), falling back to the catalog for direct/shared links.
function cmpBack(e){
  if(e) e.preventDefault();
  try {
    if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; }
  } catch {}
  location.href = '/catalog';
  return false;
}

/* ── MRR sparkline overlay (best-effort; hidden if no series) ────────────────── */
function seriesOf(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(p => {
    const v = (p && (p.mrr ?? p.value ?? p.amount ?? p.revenue));
    return Number(v);
  }).filter(v => Number.isFinite(v));
}
async function loadSpark() {
  const host = document.getElementById('cmpSpark');
  if (!host || !state.a.obj || !state.b.obj) return;
  let A = [], B = [];
  try {
    const [ra, rb] = await Promise.all([
      fetch('/api/history?slug=' + encodeURIComponent(state.a.slug) + '&days=180').then(r=>r.json()).catch(()=>null),
      fetch('/api/history?slug=' + encodeURIComponent(state.b.slug) + '&days=180').then(r=>r.json()).catch(()=>null),
    ]);
    A = seriesOf(ra && ra.data); B = seriesOf(rb && rb.data);
  } catch {}
  if (A.length < 2 && B.length < 2) return; // nothing worth drawing
  const W = 560, H = 64, pad = 6;
  const allV = A.concat(B);
  const lo = Math.min.apply(null, allV), hi = Math.max.apply(null, allV);
  const span = (hi - lo) || 1;
  const path = (arr, color) => {
    if (arr.length < 2) return '';
    const pts = arr.map((v, i) => {
      const x = (arr.length === 1) ? 0 : (i / (arr.length - 1)) * W;
      const y = H - pad - ((v - lo) / span) * (H - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  };
  const cA = 'var(--accent)', cB = 'var(--text2)';
  host.innerHTML =
    '<div class="sl-legend">'+
      '<span class="sl-ttl">'+esc(L('mrrTrend','MRR trend'))+'</span>'+
      '<span class="sl-key"><span class="sl-dash" style="background:'+cA+'"></span>'+esc(state.a.obj.name)+'</span>'+
      '<span class="sl-key"><span class="sl-dash" style="background:'+cB+'"></span>'+esc(state.b.obj.name)+'</span>'+
    '</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(L('mrrTrend','MRR trend'))+'">'+
      path(A, cA) + path(B, cB) +
    '</svg>';
  host.style.display = 'block';
}

/* ── boot ───────────────────────────────────────────────────────────────────── */
(async function init() {
  readUrl();
  await ensureAll();
  render();
  if (state.a.slug) loadSlot('a');
  if (state.b.slug) loadSlot('b');
})();
</script>
</body>
