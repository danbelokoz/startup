name: Scrape TrustMRR daily revenue charts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max startups to scrape (default: 250)'
        required: false
        default: '250'
      debug:
        description: 'Log all intercepted API calls (1 = yes)'
        required: false
        default: '0'
  schedule:
    - cron: '0 4 * * 0'  # Every Sunday at 04:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run scraper
        working-directory: scripts
        env:
          TRUSTMRR_API_KEY:          ${{ secrets.TRUSTMRR_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT:                     ${{ inputs.limit || '250' }}
          DEBUG:                     ${{ inputs.debug || '0' }}
        run: node scrape-daily-revenue.js
