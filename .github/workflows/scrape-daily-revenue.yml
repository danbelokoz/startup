name: Scrape TrustMRR daily revenue charts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Startups per run (batch size)'
        required: false
        default: '500'
      offset:
        description: 'Start index into the slug list (manual batching)'
        required: false
        default: '0'
      on_sale_only:
        description: 'Scrape for-sale startups only (1 = yes)'
        required: false
        default: '0'
      debug:
        description: 'Log all intercepted API calls (1 = yes)'
        required: false
        default: '0'
  schedule:
    # Every 6h. With ~1782 on-sale / 500-per-run, the persisted cursor sweeps all
    # ~4 windows in ~24h — so every on-sale startup refreshes well inside 2.5 days,
    # with margin even if GitHub drops some scheduled runs.
    - cron: '0 0,6,12,18 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run scraper
        working-directory: scripts
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: lets the scraper report run status to the admin "Парсеры" tab
          KV_REST_API_URL:           ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:         ${{ secrets.KV_REST_API_TOKEN }}
          # Scheduled runs cover for-sale startups only and auto-rotate the batch window
          # (window order comes from a persisted Redis cursor — see scrape-daily-revenue.js)
          ON_SALE_ONLY: ${{ github.event_name == 'schedule' && '1' || inputs.on_sale_only || '0' }}
          LIMIT:        ${{ inputs.limit || '500' }}
          OFFSET:       ${{ inputs.offset || '0' }}
          ROTATE:       ${{ github.event_name == 'schedule' && '1' || '0' }}
          # Only used as a fallback if the Redis cursor is unavailable; matches the 6h cron
          ROTATE_HOURS: '6'
          DEBUG:        ${{ inputs.debug || '0' }}
        run: node scrape-daily-revenue.js
