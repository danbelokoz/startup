name: Scrape TrustMRR daily revenue charts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max startups to scrape (ignored if on_sale_only=1)'
        required: false
        default: '250'
      on_sale_only:
        description: 'Scrape ALL for-sale startups only (1 = yes)'
        required: false
        default: '0'
      debug:
        description: 'Log all intercepted API calls (1 = yes)'
        required: false
        default: '0'
  schedule:
    - cron: '0 4 */3 * *'  # Every 3 days at 04:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run scraper
        working-directory: scripts
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs always cover for-sale startups only
          ON_SALE_ONLY: ${{ github.event_name == 'schedule' && '1' || inputs.on_sale_only || '0' }}
          LIMIT:        ${{ inputs.limit || '250' }}
          DEBUG:        ${{ inputs.debug || '0' }}
        run: node scrape-daily-revenue.js
