name: Scrape TrustMRR daily revenue charts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Startups per run (batch size)'
        required: false
        default: '500'
      offset:
        description: 'Start index into the slug list (manual batching)'
        required: false
        default: '0'
      on_sale_only:
        description: 'Scrape for-sale startups only (1 = yes)'
        required: false
        default: '0'
      debug:
        description: 'Log all intercepted API calls (1 = yes)'
        required: false
        default: '0'
  schedule:
    # Every 3h. GitHub's scheduler is best-effort and silently drops scheduled runs,
    # so we over-schedule: with ~3.8k revenue startups / 500-per-run the persisted
    # cursor needs ~8 runs for a full sweep, and 8 attempts/day means even a ~50% drop
    # rate refreshes every startup that has revenue inside ~2 days.
    # Run at :17, not :00 — GitHub delays/drops crons most at the top of the hour.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run scraper
        working-directory: scripts
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: lets the scraper report run status to the admin "Парсеры" tab
          KV_REST_API_URL:           ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:         ${{ secrets.KV_REST_API_TOKEN }}
          # Scheduled runs now cover ALL startups that have revenue (not just on-sale)
          # and auto-rotate the batch window (order from a persisted Redis cursor — see
          # scrape-daily-revenue.js). getSlugs stops at the first $0-revenue startup, so
          # the list is the ~3.8k with revenue (≈8 windows), not the full ~7.4k catalog.
          # Pass on_sale_only=1 on a manual dispatch to limit a run to for-sale startups.
          ON_SALE_ONLY: ${{ inputs.on_sale_only || '0' }}
          LIMIT:        ${{ inputs.limit || '500' }}
          OFFSET:       ${{ inputs.offset || '0' }}
          ROTATE:       ${{ github.event_name == 'schedule' && '1' || '0' }}
          # Only used as a fallback if the Redis cursor is unavailable; matches the 3h cron
          ROTATE_HOURS: '3'
          DEBUG:        ${{ inputs.debug || '0' }}
        run: node scrape-daily-revenue.js
