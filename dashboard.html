<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — StartupMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <style>
    .dash-wrap  { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    .dash-card  { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .dash-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin-bottom: 14px; }
    .user-row   { display: flex; align-items: center; gap: 14px; }
    .user-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(108,99,255,0.12); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; flex-shrink: 0; }
    .user-name  { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .plan-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .plan-chip.free { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); }
    .plan-chip.pro  { background: rgba(108,99,255,0.1); color: var(--accent); border: 1px solid rgba(108,99,255,0.25); }
    .views-row  { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .views-bar  { background: var(--bg3); border-radius: 999px; height: 6px; overflow: hidden; margin-bottom: 6px; border: 1px solid var(--border); }
    .views-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.4s ease; }
    .views-note { font-size: 12px; color: var(--text3); }
    .upgrade-box { background: rgba(108,99,255,0.06); border: 1.5px solid rgba(108,99,255,0.22); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
    .upgrade-box h3 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .upgrade-box p  { font-size: 14px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; }
    .feature-list { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--text2); margin-bottom: 20px; }
    .feature-list li::before { content: '\2713\00a0'; color: var(--green); font-weight: 700; }
    .loading-state { text-align: center; padding: 80px 24px; color: var(--text3); font-size: 14px; line-height: 1.8; }
  </style>
</head>
<body>
<div id="navPlaceholder"></div>
<div id="modalPlaceholder"></div>

<div class="dash-wrap" id="dashWrap">
  <div class="loading-state">Loading your account...</div>
</div>

<!-- Supabase SDK + shared scripts -->
<script src="/auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/shared.js"></script>
<script>
// Set this to your Stripe / LemonSqueezy checkout URL once payment is configured.
const UPGRADE_URL = '#';

window.addEventListener('DOMContentLoaded', async () => {
  applyLangToDoc();
  document.getElementById('navPlaceholder').innerHTML = buildNavHTML('');
  document.getElementById('modalPlaceholder').innerHTML = buildModalHTML();
  initNavAuth();

  if (!window.SUPABASE_URL || window.SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    document.getElementById('dashWrap').innerHTML =
      `<div class="loading-state">Supabase is not configured.<br>Set credentials in <code>auth-config.js</code>.</div>`;
    return;
  }

  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON);
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    location.href = '/auth.html?from=/dashboard.html';
    return;
  }

  window._dashSb = sb;

  // Fetch access level from server
  let access = null;
  try {
    const r = await fetch('/api/auth', { headers: { Authorization: `Bearer ${session.access_token}` } });
    if (r.ok) access = await r.json();
  } catch {}

  renderDash(session, access);
});

function renderDash(session, access) {
  const email     = session.user.email || '';
  const initial   = escHtml((email[0] || '?').toUpperCase());
  const isPro     = access?.role === 'subscriber';
  const viewsUsed = access?.viewsUsed ?? 0;
  const pct       = Math.min(100, Math.round((viewsUsed / 8) * 100));

  // ── Profile card ─────────────────────────────────────────────────────────────
  const profileCard = `
    <div class="dash-card">
      <div class="user-row">
        <div class="user-avatar">${initial}</div>
        <div>
          <div class="user-name">${escHtml(email)}</div>
          <span class="plan-chip ${isPro ? 'pro' : 'free'}">${isPro ? 'Pro' : 'Free'}</span>
        </div>
      </div>
    </div>`;

  // ── Daily usage card ──────────────────────────────────────────────────────────
  const usageCard = isPro
    ? `<div class="dash-card">
        <div class="dash-label">Today's activity</div>
        <div style="font-size:14px;color:var(--text2);">Unlimited access — no daily limits.</div>
       </div>`
    : `<div class="dash-card">
        <div class="dash-label">Today's views</div>
        <div class="views-row"><span>Startups viewed</span><span><strong>${viewsUsed}</strong>&thinsp;/&thinsp;8</span></div>
        <div class="views-bar"><div class="views-fill" style="width:${pct}%"></div></div>
        <div class="views-note">Resets at midnight UTC &middot; Free plan: 8 views/day</div>
       </div>`;

  // ── Plan / upgrade card ───────────────────────────────────────────────────────
  const planCard = isPro
    ? `<div class="dash-card">
        <div class="dash-label">Subscription</div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <span class="plan-chip pro">Pro &mdash; unlimited access</span>
          <a href="mailto:support@startupmarket.io" style="font-size:13px;color:var(--text3);">Manage subscription</a>
        </div>
       </div>`
    : `<div class="upgrade-box">
        <h3>Upgrade to Pro</h3>
        <p>Unlock unlimited startup views and full seller contact access every day.</p>
        <ul class="feature-list">
          <li>Unlimited startup views per day</li>
          <li>Full contact access on every listing</li>
          <li>Cancel anytime</li>
        </ul>
        <a href="${escHtml(UPGRADE_URL)}" class="btn btn-primary" style="display:inline-flex;">Get Pro access &rarr;</a>
       </div>`;

  // ── Sign out card ─────────────────────────────────────────────────────────────
  const signOutCard = `
    <div class="dash-card">
      <button class="btn btn-ghost" onclick="signOutDash()" style="width:100%;justify-content:center;">Sign out</button>
    </div>`;

  document.getElementById('dashWrap').innerHTML = profileCard + usageCard + planCard + signOutCard;
}

async function signOutDash() {
  const sb = window._dashSb || window._sb;
  if (sb) await sb.auth.signOut();
  location.href = '/';
}
</script>
</body>
</html>
