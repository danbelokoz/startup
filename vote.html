.vote-wrap { max-width: 980px; margin: 0 auto; padding: 36px 20px 80px; }
.vote-head { text-align: center; margin-bottom: 8px; }
.vote-kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: rgba(252,213,53,0.1); border: 1px solid rgba(252,213,53,0.25); padding: 6px 13px; border-radius: 999px; margin-bottom: 14px; }
.vote-head h1 { font-size: 33px; font-weight: 700; letter-spacing: -1px; color: var(--text); margin-bottom: 8px; }

.vote-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text3); opacity: 0.6; }
.vote-meta b { color: var(--text2); }

/* ── Winner spotlight ── */
.champ { position: relative; background:
    radial-gradient(120% 130% at 50% 0%, rgba(252,213,53,0.14), transparent 60%), var(--bg2);
  border: 1px solid rgba(252,213,53,0.32); border-radius: 22px; padding: 30px 26px 26px; text-align: center; margin-bottom: 30px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
.champ::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(252,213,53,0.05), transparent 40%); pointer-events: none; }
.champ-crown { font-size: 30px; line-height: 1; margin-bottom: 10px; }
.champ-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.champ-body { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
.champ-logo { width: 72px; height: 72px; border-radius: 18px; background: var(--bg3); border: 1px solid var(--border2); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--text2); flex-shrink: 0; overflow: hidden; }
.champ-logo img { width: 100%; height: 100%; object-fit: cover; }
.champ-info { text-align: left; min-width: 0; }
.champ-name { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; color: var(--text); margin-bottom: 4px; display: block; text-decoration: none; }
.champ-name:hover { color: var(--accent); }
.champ-sub { font-size: 13px; color: var(--text3); font-weight: 500; }
.champ-votes { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
.champ-votes b { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; color: var(--accent); }

@media (max-width: 560px) { .champ-info { text-align: center; } .champ-votes { justify-content: center; } }

/* ── List ── */

.vote-hint { font-size: 12px; color: var(--text3); font-weight: 600; }

.vote-msg { text-align: center; padding: 70px 24px; color: var(--text3); font-size: 14px; }
.vote-msg .bar { width: 160px; height: 3px; background: var(--border); border-radius: 2px; margin: 16px auto 0; overflow: hidden; }

</style>

  it:{ kicker:'Startup del mese', title:'Vota la migliore startup del mese', sub:'Una selezione di startup verificate con MRR reale. Un voto al mese — aiuta a incoronare il vincitore.', candLabel:'candidati', endsIn:'Il voto termina tra', leaderboard:'Classifica', hint:'Possono votare gli utenti registrati', winner:'In testa questo mese', votes:'voti', mrr:'MRR', vote:'Vota', voted:'Votato', signIn:'Accedi per votare', loading:'Caricamento candidati…', empty:'I candidati si stanno preparando — torna a breve.', foot:'I voti si azzerano il 1° di ogni mese. La startup con più voti diventa Startup del mese. Chiunque può sfogliare; solo gli utenti registrati possono votare.', toastVoted:'Il tuo voto è stato registrato 🎉', toastAlready:'Hai già votato questo mese.', days:'g', hours:'h', mins:'min' },

  ar:{ kicker:'شركة الشهر', title:'صوّت لأفضل شركة ناشئة هذا الشهر', sub:'قائمة مختارة من الشركات الموثّقة بإيرادات MRR حقيقية. صوت واحد شهريًا — ساعد في تتويج الفائز.', candLabel:'مرشحين', endsIn:'ينتهي التصويت خلال', leaderboard:'المتصدرون', hint:'يمكن للمستخدمين المسجّلين التصويت', winner:'المتصدّر هذا الشهر', votes:'أصوات', mrr:'MRR', vote:'صوّت', voted:'تم التصويت', signIn:'سجّل الدخول للتصويت', loading:'جارٍ تحميل المرشحين…', empty:'يتم تجهيز المرشحين — عد قريبًا.', foot:'تُعاد الأصوات إلى الصفر في الأول من كل شهر. الشركة صاحبة أكثر الأصوات تصبح شركة الشهر. يمكن للجميع التصفح؛ التصويت للمسجّلين فقط.', toastVoted:'تم احتساب صوتك 🎉', toastAlready:'لقد صوّتّ بالفعل هذا الشهر.', days:'ي', hours:'س', mins:'د' },

function vt(k){ const l=getLang(); return (VT[l]||VT.en)[k] || VT.en[k] || ''; }

// Shown when the owner has hidden the page from the admin panel.
const VT_CLOSED = {
  en:{ title:'Voting is currently closed', sub:'The Startup of the Month vote is paused right now. Please check back later.' },
  ru:{ title:'Голосование сейчас закрыто', sub:'Голосование за «Стартап месяца» приостановлено. Загляните позже.' },
  de:{ title:'Die Abstimmung ist derzeit geschlossen', sub:'Die Wahl zum Startup des Monats ist gerade pausiert. Schau später wieder vorbei.' },
  fr:{ title:'Le vote est actuellement fermé', sub:'Le vote pour la Startup du mois est en pause. Revenez plus tard.' },
  it:{ title:'Le votazioni sono chiuse', sub:'Il voto per la Startup del mese è in pausa. Torna più tardi.' },
  zh:{ title:'投票暂时关闭', sub:'“本月创业公司”投票已暂停，请稍后再来。' },
  ar:{ title:'التصويت مغلق حاليًا', sub:'تم إيقاف التصويت لشركة الشهر مؤقتًا. عد لاحقًا.' },
};
function vtc(k){ const l=getLang(); return (VT_CLOSED[l]||VT_CLOSED.en)[k] || VT_CLOSED.en[k] || ''; }

function renderClosed(){
  document.querySelector('.vote-meta')?.style.setProperty('display','none');
  const champEl = document.getElementById('champ'); if (champEl) champEl.innerHTML = '';
  const card = document.querySelector('.vote-card');
  if (card) card.innerHTML = '<div class="vote-msg" style="padding:48px 20px;">'
    + '<span style="font-size:17px;font-weight:600;color:var(--text);">' + escHtml(vtc('title')) + '</span>'
    + '<span style="margin-top:8px;">' + escHtml(vtc('sub')) + '</span></div>';
  document.getElementById('tFoot').textContent = '';
}

let CAND_COUNT = 30;   // updated from the server board once loaded

const now = new Date();

// Server owns the board now: the 30 candidates, everyone's real votes, the drawn
// "organic" base and the hourly auto-growth all live in Redis (see api/_votes.js).
// The page just reads /api/vote and renders it.
let board = { candidates: [], myVote: null, endsAt: null, building: false };
let retryTimer = null;

function authToken(){ return (window._session && window._session.access_token) || null; }
function isAuthed(){ return !!(window._session && window._session.user); }

async function loadBoard() {
  const host = document.getElementById('voteList');
  try {
    const token = authToken();
    const r = await fetch('/api/vote', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
    const j = await r.json();
    if (j.hidden) {   // owner took the page down from the admin panel
      if (window.applyVoteVisibility) applyVoteVisibility(true);
      renderClosed();
      return;
    }
    if (window.applyVoteVisibility) applyVoteVisibility(false);
    board = { candidates: j.candidates || [], myVote: j.myVote || null, endsAt: j.endsAt || null, building: !!j.building };
    if (board.candidates.length) CAND_COUNT = board.candidates.length;
    document.getElementById('tCandCount').textContent = CAND_COUNT;
    if (!board.candidates.length) {
      host.innerHTML = '<div class="vote-msg"><span>' + vt(board.building ? 'loading' : 'empty') + '</span>'
        + (board.building ? '<div class="bar"><div></div></div>' : '') + '</div>';
      // Still assembling the monthly set on the server — try again shortly.
      if (board.building) { clearTimeout(retryTimer); retryTimer = setTimeout(loadBoard, 2500); }
      return;
    }
    render();
  } catch {
    host.innerHTML = '<div class="vote-msg">' + vt('empty') + '</div>';
  }
}

// Server returns candidates already sorted by votes, descending.
function ranked(){ return board.candidates; }

function logoHTML(s, cls){
  const init = (s.name || '?').slice(0,2).toUpperCase();
  const inner = s.icon
    ? '<img src="' + escHtml(s.icon) + '" loading="lazy" onerror="this.parentElement.textContent=\'' + init + '\'"/>'
    : init;
  return '<span class="' + cls + '">' + inner + '</span>';
}

function champHTML(s){
  const votes = s.votes;
  return '<div class="champ">' +
    '<div class="champ-crown">👑</div>' +
    '<div class="champ-label">' + vt('winner') + '</div>' +
    '<div class="champ-body">' +
      logoHTML(s, 'champ-logo') +
      '<div class="champ-info">' +
        '<a class="champ-name" href="/startup/' + escHtml(s.slug) + '.html">' + escHtml(s.name) + '</a>' +
        '<div class="champ-sub">' + vt('mrr') + ' ' + (s.mrr ? formatMoney(s.mrr) : '—') + '</div>' +
        '<div class="champ-votes"><b>' + votes.toLocaleString() + '</b><span>' + vt('votes') + '</span></div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

const HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function rowHTML(s, i){
  const rank = i + 1;
  const medal = rank===1?' gold':rank===2?' silver':rank===3?' bronze':'';
  const votes = s.votes;
  const mine = board.myVote;
  const isMine = mine === s.slug;
  let btn;
  if (isMine) {
    btn = '<button class="vbtn voted" disabled>' + CHECK + vt('voted') + '</button>';
  } else if (mine) {
    // already spent this month's vote elsewhere
    btn = '<button class="vbtn disabled" disabled>' + HEART + vt('vote') + '</button>';
  } else {
    btn = '<button class="vbtn" onclick="castVote(\'' + escHtml(s.slug) + '\')">' + HEART + vt('vote') + '</button>';
  }
  return '<div class="vrow' + (rank===1?' leader':'') + '">' +
    '<span class="vrow-rank' + medal + '">' + rank + '</span>' +
    '<a class="vrow-main" href="/startup/' + escHtml(s.slug) + '.html">' +
      logoHTML(s, 'vrow-logo') +
      '<span class="vrow-nm"><div class="vrow-name">' + escHtml(s.name) + '</div>' +
        '<div class="vrow-mrr">' + vt('mrr') + ' ' + (s.mrr ? formatMoney(s.mrr) : '—') + '</div></span>' +
    '</a>' +
    '<span class="vrow-votes"><b>' + votes.toLocaleString() + '</b><span>' + vt('votes') + '</span></span>' +
    btn +
  '</div>';
}

function render(){
  const arr = ranked();
  document.getElementById('champ').innerHTML = arr.length ? champHTML(arr[0]) : '';
  document.getElementById('voteList').innerHTML = arr.map((s,i) => rowHTML(s,i)).join('');
}

let voting = false;
async function castVote(slug){
  if (!isAuthed()) {
    // Registered-only: bounce to auth, returning here afterwards.
    const from = encodeURIComponent(location.pathname + location.search);
    location.href = '/auth.html?from=' + from;
    return;
  }
  if (board.myVote || voting) { if (board.myVote) toast(vt('toastAlready')); return; }
  voting = true;
  try {
    const token = authToken();
    const r = await fetch('/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: JSON.stringify({ slug }),
    });
    if (r.status === 401) {   // session expired mid-session → re-auth
      const from = encodeURIComponent(location.pathname + location.search);
      location.href = '/auth.html?from=' + from; return;
    }
    const j = await r.json().catch(() => ({}));
    if (j && j.myVote) board.myVote = j.myVote;
    toast(vt(j && j.already ? 'toastAlready' : 'toastVoted'));
    await loadBoard();        // pull fresh, re-sorted counts (incl. this vote)
  } catch {
    toast(vt('empty'));
  } finally {
    voting = false;
  }
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('voteToast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Static i18n text + monthly meta ──────────────────────────────────────────
function applyText(){
  document.getElementById('tKicker').textContent = vt('kicker');
  document.getElementById('tTitle').textContent = vt('title');
  document.getElementById('tSub').textContent = vt('sub');
  document.getElementById('tCandLabel').textContent = vt('candLabel');
  document.getElementById('tCandCount').textContent = CAND_COUNT;
  document.getElementById('tEndsIn').textContent = vt('endsIn');
  document.getElementById('tLeaderboard').textContent = vt('leaderboard');
  document.getElementById('tHint').textContent = vt('hint');
  document.getElementById('tLoading').textContent = vt('loading');
  document.getElementById('tFoot').textContent = vt('foot');
  const locale = { en:'en-US', ru:'ru-RU', de:'de-DE', fr:'fr-FR', it:'it-IT', zh:'zh-CN', ar:'ar' }[getLang()] || 'en-US';
  document.getElementById('tMonth').textContent = now.toLocaleDateString(locale, { month:'long', year:'numeric' });
}

function tickCountdown(){
  // End of the voting month comes from the server (UTC 1st of next month); fall back
  // to a local estimate until the board loads.
  const end = board.endsAt ? new Date(board.endsAt)
            : new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const diff = end - new Date();
  const el = document.getElementById('tCountdown');
  if (diff <= 0) { el.textContent = '—'; return; }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  el.textContent = d + vt('days') + ' ' + h + vt('hours') + ' ' + m + vt('mins');
}

applyText();
tickCountdown();
setInterval(tickCountdown, 30000);
loadBoard();

// The board is first fetched without a token (auth resolves async), so myVote comes
// back null. Re-fetch once the Supabase session lands so a logged-in user sees their
// existing vote reflected. Poll briefly for window._session, then reload once.
let authTries = 0;
const authWait = setInterval(() => {
  if (window._session !== undefined || ++authTries > 12) {   // resolved, or ~6s elapsed
    clearInterval(authWait);
    if (isAuthed()) loadBoard();
  }
}, 500);
</script>
