<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Админка - Startup Market</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3"/>
<link rel="stylesheet" href="/shared.css"/>
<script src="/auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/shared.js"></script>
<style>
.adm-wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 80px; }
.adm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.adm-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
.adm-title span { color: var(--accent); }
.adm-user { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 10px; }
.adm-user a { color: var(--text3); text-decoration: none; }
.adm-user a:hover { color: var(--text); }

.adm-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.adm-tab { position: relative; border: 1px solid var(--border2); background: var(--bg2); color: var(--text2); font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: all 0.12s; }
.adm-tab:hover { border-color: var(--text); color: var(--text); }
.adm-tab.sel { background: var(--text); border-color: var(--text); color: var(--bg2); }
/* Красный кружок-счётчик непросмотренных регистраций/заявок на вкладке. */
.adm-badge { position: absolute; top: -7px; right: -7px; min-width: 19px; height: 19px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #f6465d; color: #fff; font-size: 11px; font-weight: 700; line-height: 19px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }

.adm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.adm-kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.adm-kpi .n { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); line-height: 1.1; }
.adm-kpi .l { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; line-height: 1.3; }

.adm-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
.adm-card h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.adm-legend { font-size: 11px; color: var(--text3); font-weight: 500; display: flex; gap: 12px; }
.adm-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }

.adm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.adm-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--border); white-space: nowrap; }
.adm-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
.adm-table tr:last-child td { border-bottom: none; }
.adm-table td.num { text-align: right; font-weight: 600; color: var(--text); }
.adm-table th.num { text-align: right; }
.adm-table a { color: var(--accent); text-decoration: none; font-weight: 600; }
.adm-table a:hover { color: var(--accent2); }

.adm-status { font-family: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--border2); border-radius: 8px; padding: 5px 8px; background: var(--bg2); color: var(--text2); cursor: pointer; }
.adm-status.st-new { border-color: rgba(0,194,122,0.5); color: var(--accent); }
.adm-key { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text2); white-space: nowrap; }
.adm-eye { border: 1px solid var(--border2); background: var(--bg3); border-radius: 7px; font-size: 11px; padding: 3px 8px; cursor: pointer; margin-left: 6px; color: var(--text2); font-family: inherit; }
.adm-eye:hover { color: var(--text); border-color: var(--text); }
.adm-pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }

.adm-msg { text-align: center; padding: 70px 24px; color: var(--text3); font-size: 14px; }
.adm-msg a { color: var(--accent); font-weight: 600; }
.adm-mini { font-size: 12px; color: var(--text3); }
.l2 { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
.v2 { font-size: 13px; font-weight: 600; color: var(--text); }
.adm-copy { border: 1px solid var(--border2); background: var(--bg2); border-radius: 8px; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; color: var(--text2); font-family: inherit; }
.adm-copy:hover { color: var(--text); border-color: var(--text); }
.adm-toggle { display: inline-flex; gap: 4px; }
.adm-toggle button { border: 1px solid var(--border2); background: var(--bg2); color: var(--text2); font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.adm-toggle button.sel { background: var(--text); border-color: var(--text); color: var(--bg2); }
@media (max-width: 720px) { .adm-table { font-size: 12px; } .adm-card { padding: 14px; overflow-x: auto; } }
</style>
</head>
<body>

<div class="adm-wrap">
  <div class="adm-head">
    <div class="adm-title">Startup Market <span>· Админка</span></div>
    <div class="adm-user" id="admUser"></div>
  </div>
  <div class="adm-tabs" id="admTabs" style="display:none;">
    <button class="adm-tab sel" data-tab="overview" onclick="openTab('overview')">Обзор</button>
    <button class="adm-tab" data-tab="listings" onclick="openTab('listings')">Заявки</button>
    <button class="adm-tab" data-tab="topviews" onclick="openTab('topviews')">Топ просмотров</button>
    <button class="adm-tab" data-tab="waitlist" onclick="openTab('waitlist')">Вейтлист</button>
    <button class="adm-tab" data-tab="parsers" onclick="openTab('parsers')">Парсеры</button>
    <button class="adm-tab" data-tab="botvisits" onclick="openTab('botvisits')">ИИ-боты</button>
  </div>
  <div id="admContent"><div class="adm-msg">Загружаем…</div></div>
</div>

<script>
const sbc = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON || '');
let token = null;
let topDays = 30;

/* ── Бейджи непросмотренного (новые регистрации / заявки) ───────────────────────
 * На вкладках «Обзор» (регистрации) и «Заявки» висит красный кружок с числом
 * непросмотренных. «Непросмотренные» = текущее количество минус то, что было при
 * последнем открытии этой вкладки (high-water-mark в localStorage). Открыл вкладку →
 * отметка обновляется, кружок гаснет. */
const SEEN_USERS = 'sm_adm_seen_users';
const SEEN_LISTINGS = 'sm_adm_seen_listings';
const lsGet = k => { const v = parseInt(localStorage.getItem(k) || '', 10); return Number.isNaN(v) ? null : v; };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} };

function setBadge(tab, n) {
  const btn = document.querySelector('.adm-tab[data-tab="' + tab + '"]');
  if (!btn) return;
  let b = btn.querySelector('.adm-badge');
  if (n > 0) {
    if (!b) { b = document.createElement('span'); b.className = 'adm-badge'; btn.appendChild(b); }
    b.textContent = n > 99 ? '99+' : String(n);
  } else if (b) { b.remove(); }
}

// Пересчитать оба бейджа из данных секции overview (там есть и totalUsers, и
// listingCounts по статусам — их сумма = всего заявок).
function updateBadges(o) {
  const users = o.totalUsers;
  const listingsTotal = Object.values(o.listingCounts || {}).reduce((a, b) => a + b, 0);
  // Первый визит: не показывать «всё сразу» — фиксируем текущее как просмотренное.
  if (lsGet(SEEN_USERS) == null && users != null) lsSet(SEEN_USERS, users);
  if (lsGet(SEEN_LISTINGS) == null) lsSet(SEEN_LISTINGS, listingsTotal);
  setBadge('overview', users != null ? Math.max(0, users - lsGet(SEEN_USERS)) : 0);
  setBadge('listings', Math.max(0, listingsTotal - lsGet(SEEN_LISTINGS)));
}

// Догрузить бейджи, когда стартовая вкладка — не «Обзор» (renderOverview сам их ставит).
async function refreshBadges() {
  try { updateBadges(await api('/api/admin?section=overview&days=30')); } catch {}
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (r.status === 403) throw new Error('forbidden');
  if (!r.ok) throw new Error('http_' + r.status);
  return r.json();
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = d => d.slice(8,10) + '.' + d.slice(5,7);
// All admin timestamps are shown in Moscow time (МСК, UTC+3) regardless of the
// viewer's machine timezone.
const MSK_TZ = 'Europe/Moscow';
const fmtDateTime = iso => new Date(iso).toLocaleString('ru-RU', { timeZone: MSK_TZ, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const fmtMskShort = ms => new Date(ms).toLocaleString('ru-RU', { timeZone: MSK_TZ, day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

const TAB_RENDERERS = { overview: renderOverview, listings: renderListings, topviews: renderTopviews, waitlist: renderWaitlist, parsers: renderParsers, botvisits: renderBotvisits };
// Active tab lives in the URL hash (#parsers, …) so a page refresh stays on the same
// tab and browser Back/Forward steps through the tabs you visited - instead of always
// snapping back to "Обзор". The hashchange handler is the single place that renders.
const tabFromHash = () => { const h = (location.hash || '').replace(/^#/, ''); return TAB_RENDERERS[h] ? h : 'overview'; };

// Tab buttons just navigate (mutate the hash); rendering happens via hashchange.
function openTab(tab) {
  if (tabFromHash() === tab) { renderTab(tab); return; }   // already here (e.g. topDays toggle) → re-render in place
  location.hash = tab;                                      // → fires hashchange → renderTab
}

function renderTab(tab) {
  if (!TAB_RENDERERS[tab]) tab = 'overview';
  document.querySelectorAll('.adm-tab').forEach(b => b.classList.toggle('sel', b.dataset.tab === tab));
  $('admContent').innerHTML = '<div class="adm-msg">Загружаем…</div>';
  TAB_RENDERERS[tab]().catch(e => { $('admContent').innerHTML = '<div class="adm-msg">Ошибка: ' + esc(e.message) + '</div>'; });
}

window.addEventListener('hashchange', () => renderTab(tabFromHash()));

/* ── Обзор ─────────────────────────────────────────────────────────────────── */
function lineChart(traffic) {
  const W = 720, H = 180, P = 28;
  const maxY = Math.max(1, ...traffic.map(t => t.pageviews));
  const x = i => P + i * (W - 2 * P) / Math.max(1, traffic.length - 1);
  const y = v => H - P - v * (H - 2 * P) / maxY;
  const path = key => traffic.map((t, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(t[key]).toFixed(1)).join(' ');
  const labels = traffic.filter((_, i) => i % Math.ceil(traffic.length / 8) === 0);
  const step = (W - 2 * P) / Math.max(1, traffic.length - 1);
  // Tooltip title: "DD.MM.YYYY, пн" (noon-anchored so the weekday doesn't roll over by TZ).
  const fullDay = t => fmtDay(t.date) + '.' + t.date.slice(0, 4) + ', ' + new Date(t.date + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short' });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    ${[0.25,0.5,0.75,1].map(f => `<line x1="${P}" x2="${W-P}" y1="${y(maxY*f)}" y2="${y(maxY*f)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${P-6}" y="${y(maxY*f)+3}" font-size="9" fill="var(--text3)" text-anchor="end">${Math.round(maxY*f)}</text>`).join('')}
    <path d="${path('pageviews')}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <path d="${path('visitors')}" fill="none" stroke="#7c6cf0" stroke-width="2" stroke-dasharray="4 3"/>
    ${traffic.map((t, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(t.pageviews).toFixed(1)}" r="2.1" fill="var(--accent)"/>`).join('')}
    ${labels.map(t => `<text x="${x(traffic.indexOf(t))}" y="${H-8}" font-size="9" fill="var(--text3)" text-anchor="middle">${fmtDay(t.date)}</text>`).join('')}
    ${traffic.map((t, i) => {
      const left = Math.max(0, x(i) - step / 2);
      const w = Math.min(W, x(i) + step / 2) - left;
      const tip = fullDay(t) + '|Визиты: ' + t.pageviews.toLocaleString() + '|Уникальные: ' + t.visitors.toLocaleString();
      return `<rect x="${left.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="transparent" data-tip="${esc(tip)}"/>`;
    }).join('')}
  </svg>`;
}

async function renderOverview() {
  const o = await api('/api/admin?section=overview&days=30');
  // Description coverage (our rephrase + translations). Resilient: if the section or
  // the status column isn't there yet, these stay null and the rest still renders.
  const [desc, stats] = await Promise.all([
    api('/api/admin?section=descriptions').catch(() => null),
    fetch('/api/stats').then(r => r.json()).catch(() => null),
  ]);
  const dDone    = desc && desc.done != null ? desc.done : null;
  const catTotal = stats && stats.total != null ? stats.total : null;
  const catOnSale = stats && stats.onSale != null ? stats.onSale : null;
  const catUpdated = stats && stats.updatedAt ? stats.updatedAt : null;
  const dBacklog = (catTotal != null && dDone != null) ? Math.max(catTotal - dDone, 0) : null;
  // Показная накрутка: index.html и catalog.html выводят счётчики каталога как (реальное + 300).
  // Если меняешь это число там - поменяй и здесь, чтобы «реально / фейк / показываем» сходилось.
  const CATALOG_INFLATE = 300;
  const num = v => (v != null ? v.toLocaleString() : '-');
  const t = o.traffic || [];
  const today = t[t.length - 1] || { pageviews: 0, visitors: 0 };
  const last7 = t.slice(-7);
  const pv7 = last7.reduce((a, d) => a + d.pageviews, 0);
  const uv7 = last7.reduce((a, d) => a + d.visitors, 0);
  const signupsMap = {};
  (o.signups || []).forEach(s => signupsMap[s.day] = s.signups);
  const signups7 = t.slice(-7).reduce((a, d) => a + (signupsMap[d.date] || 0), 0);
  const newListings = (o.listingCounts && o.listingCounts.new) || 0;

  $('admContent').innerHTML = `
    <div class="adm-kpis">
      <div class="adm-kpi"><div class="n">${today.pageviews.toLocaleString()}</div><div class="l">Визиты сегодня</div></div>
      <div class="adm-kpi"><div class="n">${today.visitors.toLocaleString()}</div><div class="l">Уникальные сегодня</div></div>
      <div class="adm-kpi"><div class="n">${pv7.toLocaleString()} / ${uv7.toLocaleString()}</div><div class="l">Визиты / уники за 7 дней</div></div>
      <div class="adm-kpi"><div class="n">${o.totalUsers != null ? o.totalUsers.toLocaleString() : '-'}</div><div class="l">Пользователей всего</div></div>
      <div class="adm-kpi"><div class="n">${signups7.toLocaleString()}</div><div class="l">Регистраций за 7 дней</div></div>
      <div class="adm-kpi"><div class="n">${newListings.toLocaleString()}</div><div class="l">Новых заявок</div></div>
      <div class="adm-kpi"><div class="n">${o.waitlistTotal != null ? o.waitlistTotal.toLocaleString() : '-'}</div><div class="l">В вейтлисте Pro</div></div>
      <div class="adm-kpi"><div class="n">${dDone != null ? dDone.toLocaleString() : '-'}${catTotal != null ? ' / ' + catTotal.toLocaleString() : ''}</div><div class="l">Описания готовы (с переводом)</div></div>
      <div class="adm-kpi"><div class="n">${dBacklog != null ? dBacklog.toLocaleString() : '-'}</div><div class="l">Ждут перефраза/перевода</div></div>
    </div>
    <div class="adm-card">
      <h3>Каталог - реально vs показываем${catUpdated ? ` <span class="adm-mini" style="font-weight:500;">свод ${fmtDateTime(catUpdated)}</span>` : ''}</h3>
      <table class="adm-table" style="max-width:520px;">
        <tr><th></th><th class="num">В листинге</th><th class="num">На продаже</th></tr>
        <tr><td>Реально</td><td class="num">${num(catTotal)}</td><td class="num">${num(catOnSale)}</td></tr>
        <tr><td>Накрутка показа (рисуем)</td><td class="num">+${CATALOG_INFLATE.toLocaleString()}</td><td class="num">+${CATALOG_INFLATE.toLocaleString()}</td></tr>
        <tr><td>Видят пользователи</td><td class="num">${num(catTotal != null ? catTotal + CATALOG_INFLATE : null)}</td><td class="num">${num(catOnSale != null ? catOnSale + CATALOG_INFLATE : null)}</td></tr>
      </table>
      <div class="adm-mini" style="margin-top:8px;">«Реально» - из ночного свода каталога (/api/stats, ключ sm_totals_v1). «Накрутка показа» - фиксированный +${CATALOG_INFLATE}, который index.html и catalog.html прибавляют к счётчикам в герое.</div>
    </div>
    <div class="adm-card">
      <h3>Трафик за 30 дней
        <span class="adm-legend"><span><i style="background:var(--accent)"></i>Визиты</span><span><i style="background:#7c6cf0"></i>Уникальные</span></span>
      </h3>
      ${t.some(d => d.pageviews) ? lineChart(t) + '<div class="adm-mini" style="margin-top:6px;">Наведи на график - визиты и уникальные за конкретный день.</div>' : '<div class="adm-mini">Счётчики пустые - данные начнут копиться сразу после деплоя beacon\'а.</div>'}
    </div>
    <div class="adm-card">
      <h3>Регистрации по дням (30 дней)</h3>
      ${(o.signups && o.signups.length)
        ? `<table class="adm-table"><tr><th>День</th><th class="num">Регистраций</th></tr>${o.signups.map(s =>
            `<tr><td>${fmtDay(String(s.day))}</td><td class="num">${s.signups}</td></tr>`).join('')}</table>`
        : '<div class="adm-mini">Пока нет регистраций за период.</div>'}
    </div>`;
  attachChartTips();
  updateBadges(o);                                       // выставит бейдж «Заявки»
  if (o.totalUsers != null) lsSet(SEEN_USERS, o.totalUsers);
  setBadge('overview', 0);                               // вкладку открыли → регистрации просмотрены
}

/* ── Заявки ────────────────────────────────────────────────────────────────── */
async function renderListings() {
  const { listings } = await api('/api/admin?section=listings');
  lsSet(SEEN_LISTINGS, listings.length);   // вкладку открыли → заявки просмотрены
  setBadge('listings', 0);
  if (!listings.length) { $('admContent').innerHTML = '<div class="adm-msg">Заявок пока нет.</div>'; return; }
  $('admContent').innerHTML = `<div class="adm-card" style="overflow-x:auto;">
    <h3>Заявки на размещение <span class="adm-mini">${listings.length} шт.</span></h3>
    <table class="adm-table">
      <tr><th>Дата</th><th>Провайдер</th><th>План</th><th class="num">Цена</th><th class="num">Маржа</th><th>Аноним</th><th>Email</th><th>API-ключ</th><th>Статус</th></tr>
      ${listings.map(l => `<tr>
        <td style="white-space:nowrap;">${fmtDateTime(l.created_at)}</td>
        <td>${esc(l.provider || '-')}</td>
        <td><span class="adm-pill">${esc(l.plan || '-')}</span></td>
        <td class="num">${l.price != null ? '$' + Number(l.price).toLocaleString() : '-'}</td>
        <td class="num">${l.margin != null ? Number(l.margin) + '%' : '-'}</td>
        <td>${l.anon ? 'да' : 'нет'}</td>
        <td>${esc(l.email || '-')}</td>
        <td><span class="adm-key" id="key-${l.id}">${esc(l.api_key_hint || '-')}</span><button class="adm-eye" onclick="revealKey('${l.id}')">показать</button></td>
        <td><select class="adm-status st-${esc(l.status)}" onchange="setStatus('${l.id}', this.value, this)">
          ${['new','processing','listed','rejected'].map(s => `<option value="${s}"${s===l.status?' selected':''}>${({new:'новая',processing:'в работе',listed:'размещена',rejected:'отклонена'})[s]}</option>`).join('')}
        </select></td>
      </tr>`).join('')}
    </table></div>`;
}

async function revealKey(id) {
  const el = $('key-' + id);
  try {
    const { key, note } = await api('/api/admin?section=reveal_key&id=' + id);
    if (!key) { el.textContent = note === 'not_stored' ? 'ключ не сохранён (не было LISTING_KEY_SECRET)' : 'не расшифровался'; return; }
    el.textContent = key;
    el.style.cursor = 'pointer';
    el.title = 'Кликни, чтобы скопировать';
    el.onclick = () => { navigator.clipboard.writeText(key); el.style.color = 'var(--accent)'; };

}

/* ── ИИ-боты (аудит краулинга) ─────────────────────────────────────────────────
 * middleware.js пишет в Redis каждый заход ИИ/поисковых краулеров на /startup/* и
 * /sitemap.xml. Здесь видно, кто реально нас читает, когда был последний визит и
 * тренд за 30 дней — и какие ожидаемые движки НЕ появлялись ни разу. */
function sparkline(series) {
  const vals = series.map(p => p.count);
  const max = Math.max(1, ...vals);
  const W = 120, H = 26;
  const x = i => (series.length < 2 ? W / 2 : i * W / (series.length - 1));
  const y = v => H - 2 - v * (H - 4) / max;
  if (!vals.some(v => v)) return `<svg width="${W}" height="${H}"><line x1="0" y1="${H-2}" x2="${W}" y2="${H-2}" stroke="var(--border)" stroke-width="1"/></svg>`;
  const path = series.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.count).toFixed(1)).join(' ');
  const bars = series.map((p, i) => `<rect x="${(x(i)-1).toFixed(1)}" y="0" width="2.4" height="${H}" fill="transparent" data-tip="${esc(fmtDay(p.date))}|Заходов: ${p.count}"/>`).join('');
  return `<svg width="${W}" height="${H}" style="overflow:visible"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>${bars}</svg>`;
}

/* ── Парсеры ───────────────────────────────────────────────────────────────── */
function relTime(iso) {
  if (!iso) return '';
  let s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  const future = s < 0; s = Math.abs(s);
  const unit = s < 3600 ? [Math.round(s/60),'мин'] : s < 86400 ? [Math.round(s/3600),'ч'] : [Math.round(s/86400),'дн'];
  return future ? `через ${unit[0]} ${unit[1]}` : `${unit[0]} ${unit[1]} назад`;
}
// Custom hover tooltip for the admin charts (traffic line + parser activity).
// Generic: shows any [data-tip] element's "title|line|line…" content. Delegated on
// #admContent so it survives re-renders; bound once.
let _chartTipsBound = false;
function attachChartTips() {
  if (_chartTipsBound) return;
  const content = $('admContent');
  if (!content) return;
  let tip = document.getElementById('chartTip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'chartTip';
    tip.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;display:none;max-width:270px;background:var(--bg,#0e1116);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.5;color:var(--text,#e8e8ea);box-shadow:0 8px 28px rgba(0,0,0,.45);';
    document.body.appendChild(tip);
  }
  const place = (x, y) => {
    const pad = 14, w = tip.offsetWidth, hgt = tip.offsetHeight;
    let nx = x + pad, ny = y + pad;
    if (nx + w > window.innerWidth)  nx = x - w - pad;
    if (ny + hgt > window.innerHeight) ny = y - hgt - pad;
    tip.style.left = Math.max(4, nx) + 'px';
    tip.style.top  = Math.max(4, ny) + 'px';
  };
  content.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.style.display = 'none'; return; }
    const parts = (el.getAttribute('data-tip') || '').split('|');
    tip.innerHTML = parts.map((p, i) => i === 0
      ? `<div style="font-weight:700;margin-bottom:3px;">${esc(p)}</div>`
      : `<div>${esc(p)}</div>`).join('');
    tip.style.display = 'block';
    place(e.clientX, e.clientY);
  });
  content.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  _chartTipsBound = true;
}

// Activity chart for the last 3 days (МСК). Bars = startups updated per hour, read
// against the left count axis. The thin strip on the baseline marks every run the
// parser was DUE to make per its schedule - a small block, not a full column:
// green = done · amber = late · orange = errored · red = missed. typicalBatch = how
// many startups it normally takes per run (for the "0 / N" hover on a miss).
function parserChart(h, expected, typicalBatch) {
  if (!h || !Array.isArray(h.buckets)) return '';
  const b = h.buckets;
  const hasRuns = b.some(x => x.runs > 0);
  if (!hasRuns && !(expected && expected.length))
    return '<div class="adm-mini" style="margin-top:12px;">Нет запусков за последние 3 дня.</div>';
  const maxN = Math.max(1, ...b.map(x => x.n));
  const W = 100, H = 40, MARK = 5;                 // MARK = baseline strip for schedule markers
  const baseY = H - MARK;
  const plotH = baseY - 1;
  const bw = W / b.length;
  const windowMs = h.hours * h.hourMs;
  const xOfMs = ms => ((ms - h.startMs) / windowMs) * W;

  const bars = b.map((x, i) => {
    if (!x.runs) return '';
    const barH = x.n > 0 ? Math.max(1, (x.n / maxN) * plotH) : 1;
    const allOk = x.ok === x.runs;
    const tip = fmtMskShort(h.startMs + i * h.hourMs) + ' МСК|обновлено стартапов: ' + x.n
      + '|запусков за час: ' + x.runs + (allOk ? '|✓ успех' : '|✕ есть ошибки');
    return `<rect x="${(i*bw).toFixed(2)}" y="${(baseY-barH).toFixed(2)}" width="${(bw*0.74).toFixed(2)}" height="${barH.toFixed(2)}" fill="${allOk ? 'var(--green)' : '#f5a623'}" data-tip="${esc(tip)}"/>`;
  }).join('');

  // Schedule markers: small blocks sitting in the baseline strip (not full columns).
  let okc = 0, failc = 0, latec = 0, missc = 0, marks = '';
  const COL = { ok:'var(--green)', fail:'#f5a623', late:'#facc15', missed:'#f6465d', pending:'var(--text3)' };
  const ofN = (typeof typicalBatch === 'number' && typicalBatch > 0) ? ' из ~' + typicalBatch.toLocaleString() : '';
  const mw = Math.min(2.4, bw * 0.85);
  (expected || []).forEach(e => {
    const x = xOfMs(e.ts);
    if (x < -0.5 || x > W + 0.5) return;
    if (e.state === 'ok') okc++; else if (e.state === 'fail') failc++;
    else if (e.state === 'late') latec++; else if (e.state === 'missed') missc++;
    const label = e.state === 'ok'      ? '✓ запуск выполнен'
                : e.state === 'fail'    ? '✕ запущен, но завершился с ошибкой|обработано 0' + ofN
                : e.state === 'late'    ? '⏳ опаздывает - запуска ещё не было|обновлено 0' + ofN
                : e.state === 'missed'  ? '⚠ пропущен - запуска не было|обновлено 0' + ofN
                :                         '… ожидается (по плану только что)';
    const tip = 'по плану: ' + fmtMskShort(e.ts) + ' МСК|' + label;
    marks += `<rect x="${(x-mw/2).toFixed(2)}" y="${(baseY+0.6).toFixed(2)}" width="${mw.toFixed(2)}" height="${(MARK-1.2).toFixed(2)}" rx="0.4" fill="${COL[e.state]}" data-tip="${esc(tip)}"/>`;
  });

  const seps = [24, 48].map(i => `<line x1="${(i*bw).toFixed(2)}" y1="0" x2="${(i*bw).toFixed(2)}" y2="${baseY}" stroke="var(--border)" stroke-width="0.3" stroke-dasharray="1 1"/>`).join('');
  const grid = [0.5, 1].map(f => `<line x1="0" y1="${(baseY - f*plotH).toFixed(2)}" x2="${W}" y2="${(baseY - f*plotH).toFixed(2)}" stroke="var(--border)" stroke-width="0.25" stroke-dasharray="0.6 0.9"/>`).join('');

  const sumParts = [];
  if (okc)   sumParts.push(`<b style="color:var(--green);">✓ ${okc}</b>`);
  if (failc) sumParts.push(`<b style="color:#f5a623;">✕ ошибка ${failc}</b>`);
  if (latec) sumParts.push(`<b style="color:#facc15;">⏳ опаздывает ${latec}</b>`);
  if (missc) sumParts.push(`<b style="color:#f6465d;">⚠ пропущено ${missc}</b>`);
  const summary = (expected && expected.length) ? `<span class="adm-mini">по плану за 3 дня: ${sumParts.join(' · ')}</span>` : '';

  // Bottom timeline (МСК): a few evenly spaced labels so time reads without hover.
  const NX = 4;
  const xLabels = Array.from({ length: NX }, (_, i) => {
    const lab = i === NX - 1 ? 'сейчас' : esc(fmtMskShort(h.startMs + (i / (NX - 1)) * windowMs));
    const ta = i === 0 ? 'left' : i === NX - 1 ? 'right' : 'center';
    return `<span class="adm-mini" style="flex:1;text-align:${ta};">${lab}</span>`;
  }).join('');

  const CH = 74, padB = Math.round(CH * MARK / H);   // px height + bottom pad so axis "0" meets the baseline
  return `<div style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;">
      <span class="l2">Активность за 3 дня · по часам · МСК</span>
      ${summary}
    </div>
    <div style="display:flex;gap:5px;">
      <div style="width:30px;height:${CH}px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:1px 0 ${padB}px;">
        <span class="adm-mini">${maxN.toLocaleString()}</span>
        <span class="adm-mini">${Math.round(maxN/2).toLocaleString()}</span>
        <span class="adm-mini">0</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="flex:1;height:${CH}px;display:block;background:var(--bg2);border:1px solid var(--border);border-radius:8px;">
        ${grid}${seps}
        <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--border)" stroke-width="0.45"/>
        ${bars}${marks}
      </svg>
    </div>
    <div style="display:flex;margin:3px 0 0 35px;">${xLabels}</div>
    <div class="adm-mini" style="margin-top:5px;">столбцы - обновлено стартапов · полоса снизу - план: <span style="color:var(--green);">▮</span> выполнен <span style="color:#f5a623;">▮</span> ошибка <span style="color:#facc15;">▮</span> опаздывает <span style="color:#f6465d;">▮</span> пропуск</span>
  </div>`;
}
async function renderParsers() {
  const { parsers } = await api('/api/admin?section=parsers');
  const dt = iso => iso ? fmtDateTime(iso) : '-';
  $('admContent').innerHTML = `<div class="adm-card">
    <h3>Парсеры и обновления <span class="adm-mini">время МСК</span></h3>
    <div class="adm-mini" style="margin-bottom:14px;">Каждый парсер пишет статус в Redis при каждом запуске. Всё время - московское (МСК). «Обновлено сегодня» считается по UTC-суткам.</div>
    <div style="display:grid;gap:12px;">
    ${parsers.map(p => {
      const okBadge = p.lastRun == null
        ? '<span class="adm-pill">нет данных</span>'
        : (p.ok ? '<span class="adm-pill" style="border-color:rgba(14,203,129,0.4);color:var(--green);">✓ успешно</span>'
                : '<span class="adm-pill" style="border-color:rgba(245,166,35,0.55);color:#f5a623;">✕ завершился с ошибкой</span>');
      // In-flight / crashed-run badge: ⏳ while running, ⚠ if it started but never finished.
      const runBadge = p.running
        ? (p.running.stale
            ? `<span class="adm-pill" style="border-color:rgba(245,166,35,0.6);color:#f5a623;">⚠ запущен, не завершён · ~${p.running.ageMin} мин</span>`
            : `<span class="adm-pill" style="border-color:rgba(124,156,255,0.5);color:#7c9cff;">⏳ выполняется · ~${p.running.ageMin} мин</span>`)
        : '';
      const cnt = p.onDemand
        ? (p.today != null ? p.today.toLocaleString() : '-')
        : ((p.attempted != null || p.count != null)
            ? `${p.attempted != null ? p.attempted.toLocaleString() : '-'} → ${p.count != null ? p.count.toLocaleString() : '-'}`
            : '-');
      return `<div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg3);">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
          <div style="font-size:14px;font-weight:700;color:var(--text);">${esc(p.name)}</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${runBadge}${okBadge}<span class="adm-pill">${esc(p.source)}</span></div>
        </div>
        <div class="adm-mini" style="line-height:1.5;margin-bottom:12px;">${esc(p.desc)}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;">
          <div><div class="l2">Последнее обновление</div><div class="v2">${dt(p.lastRun)}</div>${p.lastRun?`<div class="adm-mini">${relTime(p.lastRun)}</div>`:''}</div>
          <div><div class="l2">Следующее обновление</div><div class="v2">${p.onDemand ? 'по запросу' : dt(p.nextRun)}</div>${p.onDemand?'':(p.nextRun?`<div class="adm-mini">${relTime(p.nextRun)}</div>`:'')}</div>
          <div><div class="l2">${p.onDemand ? 'Обновлено сегодня (UTC)' : 'Взято → обработано'}</div><div class="v2">${cnt}</div>${p.onDemand ? '' : '<div class="adm-mini">в работу → реально обработано</div>'}</div>
          <div><div class="l2">Расписание</div><div class="v2" style="font-size:12px;line-height:1.4;">${esc(p.scheduleText)}</div></div>
        </div>
        ${p.note ? `<div class="adm-mini" style="margin-top:10px;">Детали последнего запуска: ${esc(p.note)}</div>` : ''}
        ${parserChart(p.history, p.expected, p.attempted)}
      </div>`;
    }).join('')}
    </div>
  </div>`;
  attachChartTips();
}
