<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Генератор карточки стартапа · StartupMarket</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#17181C; --bg2:#1E2026; --bg3:#252830; --border:#2B2F38;
    --text:#EAECEF; --text2:#B7BDC6; --text3:#848E9C;
    --yellow:#FCD535; --yellow2:#F0B90B; --green:#0ECB81; --green-bg:rgba(14,203,129,.12);
    --red:#F6465D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#0C0D10;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  /* ── Панель управления ─────────────────────────── */
  .cb-bar{max-width:820px;margin:18px auto 0;padding:0 16px;position:relative;}
  .cb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .cb-input{flex:1;min-width:220px;background:var(--bg2);border:1px solid var(--border);
    border-radius:10px;color:var(--text);font-size:15px;padding:12px 14px;outline:none;}
  .cb-input:focus{border-color:var(--yellow2);}
  .cb-btn{background:var(--yellow);color:#1A1A1A;border:none;border-radius:10px;
    font-size:14px;font-weight:700;padding:12px 18px;cursor:pointer;white-space:nowrap;}
  .cb-btn:disabled{opacity:.5;cursor:default;}
  .cb-btn.ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
  .cb-status{font-size:12px;color:var(--text3);margin-top:8px;min-height:16px;}
  .cb-drop{position:absolute;left:16px;right:16px;top:52px;z-index:20;background:var(--bg2);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);
    max-height:340px;overflow-y:auto;display:none;}
  .cb-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
  .cb-opt:last-child{border-bottom:none;}
  .cb-opt:hover{background:var(--bg3);}
  .cb-opt-name{font-size:14px;font-weight:600;color:var(--text);}
  .cb-opt-sub{font-size:11px;color:var(--text3);margin-top:2px;}
  .cb-opt-price{font-size:13px;font-weight:700;color:var(--yellow);white-space:nowrap;}

  .cb-actions{max-width:820px;margin:16px auto 0;padding:0 16px;display:none;gap:10px;align-items:center;}
  .cb-note{font-size:12px;color:var(--text3);}

  /* ── Область просмотра карточки ─────────────────── */
  .cb-stage{margin:18px auto 60px;overflow-x:auto;padding:0 16px;}
  .cb-stage-inner{width:210mm;margin:0 auto;}
  .cb-empty{max-width:820px;margin:40px auto;padding:0 16px;color:var(--text3);
    font-size:14px;text-align:center;line-height:1.6;}

  /* ── Карточка (идентична one-pager) ─────────────── */
  .page{
    width:210mm; padding:14mm 16mm 16mm;
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(252,213,53,.06), transparent 60%),
      var(--bg);
    position:relative; overflow:hidden;
    box-shadow:0 12px 60px rgba(0,0,0,.5);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:11px;border-bottom:1px solid var(--border);}
  .brand-left{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:44px;height:44px;flex-shrink:0;}
  .brand-word{font-size:19px;font-weight:800;letter-spacing:.5px;line-height:1;}
  .brand-word .m{color:var(--text3);font-weight:700;}
  .brand-sub{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:.3px;}
  .brand-right{text-align:right;}
  .sheet-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--yellow);
    background:rgba(252,213,53,.1);border:1px solid rgba(252,213,53,.28);
    border-radius:999px;padding:5px 11px;}
  .sheet-date{font-size:11px;color:var(--text3);margin-top:6px;}

  .hero{display:flex;align-items:center;gap:18px;margin-top:16px;}
  .app-icon{width:72px;height:72px;border-radius:16px;flex-shrink:0;overflow:hidden;
    background:var(--bg3);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;color:var(--text2);}
  .app-icon img{width:100%;height:100%;object-fit:cover;}
  .hero-main{flex:1;min-width:0;}
  .hero-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .hero-name{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1;}
  .hero-price{display:inline-flex;align-items:baseline;gap:8px;
    background:rgba(252,213,53,.10);border:1px solid rgba(252,213,53,.30);
    border-radius:12px;padding:8px 14px;}
  .hero-price .hp-cap{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);}
  .hero-price .hp-val{font-size:22px;font-weight:800;color:var(--yellow);letter-spacing:-.4px;line-height:1;}
  .hero-price .hp-mult{font-size:12px;font-weight:700;color:var(--text2);}
  .hero-meta{margin-top:8px;font-size:12px;color:var(--text3);letter-spacing:.2px;}

  .sec{margin-top:13px;}
  .sec-title{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:9px;}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--border);}

  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .m-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
    padding:13px 15px 12px;position:relative;}
  .m-card.feat{grid-column:span 1;background:
    linear-gradient(160deg,rgba(252,213,53,.10),rgba(252,213,53,0) 55%),var(--bg2);
    border-color:rgba(252,213,53,.28);}
  .m-label{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.2px;}
  .m-value{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-top:5px;line-height:1;}
  .m-sub{font-size:11px;margin-top:6px;color:var(--text3);}
  .up{color:var(--green);font-weight:700;}
  .down{color:var(--red);font-weight:700;}
  .flat{color:var(--text2);font-weight:700;}
  .verified{position:absolute;top:13px;right:13px;font-size:9px;font-weight:700;
    letter-spacing:.03em;color:var(--green);background:var(--green-bg);
    border:1px solid rgba(14,203,129,.22);border-radius:999px;padding:3px 8px;
    display:inline-flex;align-items:center;gap:4px;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;}

  .chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px 6px;}
  .chart-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;}
  .chart-cur{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1;}
  .chart-meta{font-size:11px;color:var(--text3);margin-top:4px;}
  .chart-legend{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
  .lg-dot{width:11px;height:3px;border-radius:2px;background:var(--yellow);display:inline-block;}
  .mrr-chart{width:100%;height:auto;display:block;overflow:visible;font-family:inherit;}

  .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text3);}
  .kv .v{color:var(--text);font-weight:600;text-align:right;}
  .deal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:6px 16px;}
  .price-row{display:flex;align-items:baseline;justify-content:space-between;
    padding:14px 0 12px;border-bottom:1px dashed var(--border);}
  .price-row .k{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
  .price-row .v{font-size:30px;font-weight:800;color:var(--yellow);letter-spacing:-.5px;}
</style>
</head>
<body>

<div class="cb-bar">
  <div class="cb-row">
    <input id="cbInput" class="cb-input" autocomplete="off" spellcheck="false"
           placeholder="Название стартапа, slug или ссылка /startup/…"/>
    <button id="cbGo" class="cb-btn">Построить</button>
  </div>
  <div id="cbStatus" class="cb-status"></div>
  <div id="cbDrop" class="cb-drop"></div>
</div>

<div class="cb-actions" id="cbActions">
  <button id="cbDownload" class="cb-btn">↓ Скачать PNG</button>
  <button id="cbReset" class="cb-btn ghost">Очистить</button>
  <span class="cb-note">Высокое разрешение (×3), фон прозрачный не сохраняется — берётся фон карточки.</span>
</div>

<div class="cb-empty" id="cbEmpty">
  Введите название стартапа (поиск по каталогу), его <b>slug</b> или вставьте ссылку вида
  <b>/startup/имя-стартапа</b> — и получите готовую карточку со всеми метриками.<br/>
  Карточку можно скачать картинкой в высоком качестве.
</div>

<div class="cb-stage" id="cbStage" style="display:none;">
  <div class="cb-stage-inner"><div id="cardHost"></div></div>
</div>

<script>
/* ══ Формат-хелперы ══════════════════════════════════════════════════════ */
const RU_MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля',
  'августа','сентября','октября','ноября','декабря'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(v){
  if (v === null || v === undefined || v === '' || Number.isNaN(Number(v))) return '—';
  return '$' + Math.round(Number(v)).toLocaleString('ru-RU');
}
function pct(v){ // "12,6%"
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  return (Math.round(Math.abs(n) * 10) / 10).toLocaleString('ru-RU') + '%';
}
function mult(v){
  const n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return '';
  return n.toFixed(2).replace('.', ',') + '×';
}
// «6 июля 2026»
function ruDate(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  if (Number.isNaN(dt.getTime())) return '';
  return dt.getDate() + ' ' + RU_MONTHS_GEN[dt.getMonth()] + ' ' + dt.getFullYear();
}
// «14 июня»
function ruDayMonth(iso){
  if (!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  if (p.length < 3) return '';
  return parseInt(p[2],10) + ' ' + RU_MONTHS_GEN[parseInt(p[1],10)-1];
}
function hostname(url){ try { return new URL(url).hostname.replace(/^www\./,''); } catch { return url; } }
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
// Корректная капитализация известных платёжных провайдеров.
const PROVIDER_LABELS = { revenuecat:'RevenueCat', stripe:'Stripe', paddle:'Paddle',
  lemonsqueezy:'Lemon Squeezy', gumroad:'Gumroad', paypal:'PayPal', chargebee:'Chargebee',
  appstore:'App Store', playstore:'Google Play', shopify:'Shopify' };
function providerLabel(p){ if (!p) return ''; return PROVIDER_LABELS[String(p).toLowerCase().replace(/[\s_-]/g,'')] || cap(p); }

/* ══ Каталог-индекс для поиска по названию ════════════════════════════════ */
const INDEX = [];
const seen = new Set();
let indexing = false, indexDone = false;

function setStatus(t){ document.getElementById('cbStatus').textContent = t || ''; }

async function indexSet(params){
  let page = 1;
  for(;;){
    const p = new URLSearchParams({ page, limit: 50, sort: 'revenue-desc', ...params });
    let j;
    try { const r = await fetch('/api/startups?' + p); if(!r.ok) break; j = await r.json(); }
    catch { break; }
    for (const s of (j.data || [])) {
      if (s && s.slug && !seen.has(s.slug)) {
        seen.add(s.slug);
        INDEX.push({ slug:s.slug, name:s.name || s.slug, onSale:!!s.onSale,
          askingPrice:s.askingPrice, category:s.category });
      }
    }
    if (indexing) setStatus('Индексирую каталог для поиска… ' + INDEX.length + ' стартапов');
    if (!(j.meta && j.meta.hasMore)) break;
    page++;
  }
}

async function buildIndex(){
  if (indexing || indexDone) return;
  indexing = true;
  try {
    await indexSet({ onSale: 'true' });   // сначала — то, что на продаже (у них есть цена)
    await indexSet({});                    // затем — весь каталог
  } finally {
    indexing = false; indexDone = true;
    setStatus('Готово: ' + INDEX.length + ' стартапов в поиске. Начните вводить название.');
    doSearch(document.getElementById('cbInput').value);
  }
}

const looksLikeSlug = q => /^[a-z0-9][a-z0-9-]*$/i.test(q) && !q.includes(' ');
function extractSlug(q){
  q = q.trim();
  const m = q.match(/\/startup\/([^/?#]+)/i);
  if (m) return m[1];
  return q;
}

function doSearch(raw){
  const drop = document.getElementById('cbDrop');
  const q = (raw || '').trim().toLowerCase();
  if (q.length < 2) { drop.style.display = 'none'; drop.innerHTML = ''; return; }
  const matches = INDEX.filter(s => (s.name || '').toLowerCase().includes(q) ||
    (s.slug || '').toLowerCase().includes(q)).slice(0, 14);
  if (!matches.length) { drop.style.display = 'none'; drop.innerHTML = ''; return; }
  drop.innerHTML = matches.map(s => `
    <div class="cb-opt" data-slug="${esc(s.slug)}">
      <div>
        <div class="cb-opt-name">${esc(s.name)}</div>
        <div class="cb-opt-sub">${esc(s.category || '')}${s.onSale ? ' · на продаже' : ''}</div>
      </div>
      ${s.onSale && s.askingPrice ? `<div class="cb-opt-price">${money(s.askingPrice)}</div>` : ''}
    </div>`).join('');
  drop.style.display = 'block';
  drop.querySelectorAll('.cb-opt').forEach(el =>
    el.addEventListener('click', () => { pick(el.dataset.slug); }));
}

/* ══ Загрузка данных + рендер ═════════════════════════════════════════════ */
let debTimer = null;
const input = document.getElementById('cbInput');
input.addEventListener('input', () => { clearTimeout(debTimer); debTimer = setTimeout(() => doSearch(input.value), 160); });
input.addEventListener('focus', buildIndex);
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
document.getElementById('cbGo').addEventListener('click', go);
document.addEventListener('click', e => {
  if (!e.target.closest('.cb-bar')) document.getElementById('cbDrop').style.display = 'none';
});

function go(){
  const v = input.value.trim();
  if (!v) return;
  // Если в выпадающем есть точное совпадение по имени — берём его, иначе трактуем как slug/URL.
  const q = v.toLowerCase();
  const exact = INDEX.find(s => (s.name || '').toLowerCase() === q);
  pick(exact ? exact.slug : extractSlug(v));
}

function pick(slug){
  document.getElementById('cbDrop').style.display = 'none';
  loadCard(slug);
}

async function loadCard(slug){
  slug = (slug || '').trim();
  if (!slug) return;
  setStatus('Загружаю данные: ' + slug + '…');
  document.getElementById('cbGo').disabled = true;
  try {
    const [sRes, eRes, hRes] = await Promise.all([
      fetch('/api/startup?slug=' + encodeURIComponent(slug)).then(r => r.json()).catch(() => null),
      fetch('/api/enrich?slug=' + encodeURIComponent(slug)).then(r => r.json()).catch(() => null),
      fetch('/api/history?slug=' + encodeURIComponent(slug) + '&days=365').then(r => r.json()).catch(() => null),
    ]);
    const s = sRes && sRes.data;
    if (!s || !s.slug) { setStatus('Стартап не найден: ' + slug); return; }
    const enrich = (eRes && eRes.data) || {};
    const hist = (hRes && Array.isArray(hRes.data)) ? hRes.data : [];
    render(s, enrich, hist);
    setStatus('Карточка «' + (s.name || slug) + '» готова.');
    input.value = s.name || slug;
  } catch (err) {
    setStatus('Ошибка загрузки: ' + err.message);
  } finally {
    document.getElementById('cbGo').disabled = false;
  }
}

/* ── Плавный график MRR (Catmull-Rom → Bezier) ─────────────────────────── */
function buildChart(series){
  // series: [{date, val}] по возрастанию даты. Берём последние 30 точек.
  const pts = series.filter(p => p.val != null && Number.isFinite(Number(p.val)));
  if (pts.length < 2) return null;
  const last30 = pts.slice(-30);
  const vals = last30.map(p => Number(p.val));
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  if (vMin === vMax) { vMin -= 1; vMax += 1; }
  const X0 = 10, X1 = 688, yMax = 35.5, yMin = 102.5, base = 126;
  const n = last30.length;
  const xy = last30.map((p, i) => ({
    x: X0 + (X1 - X0) * (n === 1 ? 0 : i / (n - 1)),
    y: yMin + (yMax - yMin) * ((Number(p.val) - vMin) / (vMax - vMin)),
    date: p.date, val: Number(p.val),
  }));
  const f = v => (Math.round(v * 10) / 10).toFixed(1);
  let line = `M${f(xy[0].x)},${f(xy[0].y)}`;
  for (let i = 0; i < xy.length - 1; i++) {
    const p0 = xy[i-1] || xy[i], p1 = xy[i], p2 = xy[i+1], p3 = xy[i+2] || xy[i+1];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    line += ` C${f(c1x)},${f(c1y)} ${f(c2x)},${f(c2y)} ${f(p2.x)},${f(p2.y)}`;
  }
  const area = line + ` L${f(xy[xy.length-1].x)},${base} L${f(xy[0].x)},${base} Z`;
  const last = xy[xy.length - 1];
  // Сетка: три линии min / mid / max.
  const vMid = (vMin + vMax) / 2;
  const grid = [
    { y: yMin, lbl: money(vMin) },
    { y: (yMin + yMax) / 2, lbl: money(vMid) },
    { y: yMax, lbl: money(vMax) },
  ].map(g => `<line x1="10" y1="${f(g.y)}" x2="688" y2="${f(g.y)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 4"/>`
    + `<text x="688" y="${f(g.y-3)}" text-anchor="end" font-size="10" fill="var(--text3)">${esc(g.lbl)}</text>`).join('');
  const midIdx = Math.floor((n - 1) / 2);
  const xLabels =
    `<text x="${f(xy[0].x)}" y="143" text-anchor="start" font-size="10" fill="var(--text3)">${esc(ruDayMonth(xy[0].date))}</text>`
    + `<text x="${f(xy[midIdx].x)}" y="143" text-anchor="middle" font-size="10" fill="var(--text3)">${esc(ruDayMonth(xy[midIdx].date))}</text>`
    + `<text x="${f(last.x)}" y="143" text-anchor="end" font-size="10" fill="var(--text3)">${esc(ruDayMonth(last.date))}</text>`;
  const svg = `<svg class="mrr-chart" viewBox="0 0 700 150">
      <defs><linearGradient id="mrrGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FCD535" stop-opacity="0.22"/>
        <stop offset="1" stop-color="#FCD535" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#mrrGrad)"/>
      <path d="${line}" fill="none" stroke="var(--yellow)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${f(last.x)}" cy="${f(last.y)}" r="3.3" fill="var(--yellow)" stroke="var(--bg2)" stroke-width="2"/>
      ${xLabels}
    </svg>`;
  return {
    svg, cur: last.val, min: vMin, max: vMax, days: n,
    lastDate: last.date, firstDate: xy[0].date,
  };
}

/* ── Рендер карточки ───────────────────────────────────────────────────── */
function render(s, enrich, hist){
  const ai = enrich.aiEnrichment || {};
  const rev = s.revenue || {};
  const provider = s.paymentProvider ? providerLabel(s.paymentProvider) : '';
  const businessType = (ai.businessType && ai.businessType !== 'Unknown') ? ai.businessType : '';
  const onSale = !!s.onSale;
  const priceOk = onSale && Number(s.askingPrice) > 0;
  const multiple = s.multiple != null ? s.multiple : enrich.cachedMultiple;

  // ── Хиро-мета ──
  const metaParts = [];
  if (s.category) metaParts.push(esc(s.category));
  if (businessType) metaParts.push(esc(businessType));
  if (s.country) metaParts.push(esc(s.country));
  if (onSale) metaParts.push('на продаже');
  const heroMeta = metaParts.join(' · ');

  // ── Иконка ──
  const fb = esc((s.name || '?').charAt(0).toUpperCase());
  const icon = s.icon
    ? `<img src="${esc(s.icon)}" crossorigin="anonymous" alt="" data-fb="${fb}" onerror="this.parentElement.textContent=this.getAttribute('data-fb')"/>`
    : `<span>${fb}</span>`;

  // ── Цена рядом с названием ──
  const heroPrice = priceOk ? `
    <span class="hero-price">
      <span class="hp-cap">Цена</span>
      <span class="hp-val">${money(s.askingPrice)}</span>
      ${multiple ? `<span class="hp-mult">${mult(multiple)}</span>` : ''}
    </span>` : '';

  // ── Метрики ──
  const gMrrRaw = s.growthMRR30d != null ? s.growthMRR30d : enrich.cachedGrowthMRR30d;
  let mrrSub = '';
  if (gMrrRaw != null && Number.isFinite(Number(gMrrRaw))) {
    const g = Number(gMrrRaw);
    if (Math.abs(g) < 0.05) mrrSub = `<span class="flat">без изменений</span> к пред. 30 дн.`;
    else if (g > 0) mrrSub = `<span class="up">↑ ${pct(g)}</span> к пред. 30 дн.`;
    else mrrSub = `<span class="down">↓ ${pct(g)}</span> к пред. 30 дн.`;
  }
  const gRaw = s.growth30d != null ? s.growth30d : enrich.cachedGrowth30d;
  let revSub = 'за последние 30 дней';
  if (gRaw != null && Number.isFinite(Number(gRaw))) {
    const g = Number(gRaw);
    if (Math.abs(g) < 0.05) revSub = `<span class="flat">без изменений</span> за 30 дней`;
    else if (g > 0) revSub = `<span class="up">↑ ${pct(g)}</span> рост за 30 дней`;
    else revSub = `<span class="down">↓ ${pct(g)}</span> за 30 дней`;
  }

  // Подписки / клиенты (0 = «не сообщается» → показываем клиентов или прочерк)
  let subsCard;
  if (Number(s.activeSubscriptions) > 0)
    subsCard = mCard('Активные подписки', Number(s.activeSubscriptions).toLocaleString('ru-RU'), 'платящих подписчиков');
  else if (Number(s.customers) > 0)
    subsCard = mCard('Клиенты', Number(s.customers).toLocaleString('ru-RU'), 'всего покупателей');
  else
    subsCard = mCard('Активные подписки', '—', 'нет данных');

  const marginVal = s.profitMarginLast30Days;
  const marginSub = (Number(marginVal) >= 80) ? 'почти нулевые расходы' : 'за последние 30 дней';
  const marginCard = (marginVal != null && Number.isFinite(Number(marginVal)))
    ? mCard('Маржа прибыли (30 дн.)', Math.round(Number(marginVal)) + '%', marginSub)
    : mCard('Маржа прибыли (30 дн.)', '—', 'нет данных');

  const multCard = multiple
    ? mCard('Мультипл выручки', mult(multiple), 'цена ÷ годовая выручка')
    : mCard('Выручка за месяц', money(rev.last30Days), 'последние 30 дней');

  const verified = provider
    ? `<span class="verified"><span class="dot"></span>Проверено · ${esc(provider)}</span>` : '';

  const metrics = `
    <div class="m-card feat">
      ${verified}
      <div class="m-label">MRR</div>
      <div class="m-value">${money(rev.mrr)}</div>
      ${mrrSub ? `<div class="m-sub">${mrrSub}</div>` : ''}
    </div>
    ${mCard('Выручка (30 дней)', money(rev.last30Days), revSub)}
    ${subsCard}
    ${marginCard}
    ${mCard('Выручка за всё время', money(rev.total), 'суммарно')}
    ${multCard}
  `;

  // ── График ──
  const series = hist.map(r => ({ date: r.snap_date, val: r.mrr_cents }));
  if (rev.mrr != null && series.length) {
    // Приколоть последнюю точку к живому значению MRR (как на странице стартапа).
    const today = new Date().toISOString().slice(0, 10);
    const last = series[series.length - 1];
    if (last && last.date === today) last.val = rev.mrr;
    else series.push({ date: today, val: rev.mrr });
  }
  const chart = buildChart(series);
  const chartSection = chart ? `
    <div class="sec">
      <div class="sec-title">Динамика MRR · по дням</div>
      <div class="chart-card">
        <div class="chart-head">
          <div>
            <div class="chart-cur">${money(chart.cur)}</div>
            <div class="chart-meta">на ${esc(ruDayMonth(chart.lastDate))} · диапазон ${money(chart.min)} – ${money(chart.max)} за ${chart.days} дн.</div>
          </div>
          <div class="chart-legend"><span class="lg-dot"></span>MRR, снимок ежедневно в 3:00 UTC</div>
        </div>
        ${chart.svg}
      </div>
    </div>` : '';

  // ── Сделка ──
  const dealRows = [];
  if (multiple) dealRows.push(kv('Мультипл выручки', mult(multiple).replace('×','× годовых')));
  if (provider) dealRows.push(kv('Платёжный провайдер', esc(provider) + ' (подтверждён)'));
  if (enrich.cachedRank) dealRows.push(kv('Место в рейтинге выручки', '#' + enrich.cachedRank));
  const dealSection = priceOk ? `
    <div>
      <div class="sec-title">Сделка</div>
      <div class="deal-box">
        <div class="price-row"><span class="k">Цена</span><span class="v">${money(s.askingPrice)}</span></div>
        ${dealRows.join('')}
      </div>
    </div>` : '';

  // ── О компании ──
  const aboutRows = [];
  if (s.category) aboutRows.push(kv('Категория', esc(s.category) + (businessType ? ' · ' + esc(businessType) : '')));
  if (s.country) aboutRows.push(kv('Страна', esc(s.country)));
  if (s.foundedDate) { const y = new Date(s.foundedDate).getFullYear(); if (y) aboutRows.push(kv('Основан', y)); }
  if (Array.isArray(ai.tags) && ai.tags.length) aboutRows.push(kv('Теги', esc(ai.tags.slice(0,4).join(' · '))));
  if (s.website) aboutRows.push(kv('Сайт', esc(hostname(s.website))));
  const aboutSection = aboutRows.length ? `
    <div>
      <div class="sec-title">О компании</div>
      ${aboutRows.join('')}
    </div>` : '';

  const bottomSection = (dealSection || aboutSection) ? `
    <div class="sec"><div class="cols">${dealSection || '<div></div>'}${aboutSection || '<div></div>'}</div></div>` : '';

  const html = `
  <div class="page" id="cardPage">
    <div class="brand">
      <div class="brand-left">
        ${BRAND_LOGO}
        <div>
          <div class="brand-word">STARTUP<span class="m"> MARKET</span></div>
          <div class="brand-sub">Проверенные стартапы с реальной выручкой · startupmarket.tech</div>
        </div>
      </div>
      <div class="brand-right">
        <span class="sheet-tag">Карточка стартапа</span>
        <div class="sheet-date">Данные на ${esc(ruDate(new Date()))} · за 30 дней</div>
      </div>
    </div>

    <div class="hero">
      <div class="app-icon">${icon}</div>
      <div class="hero-main">
        <div class="hero-top">
          <div class="hero-name">${esc(s.name || s.slug)}</div>
          ${heroPrice}
        </div>
        ${heroMeta ? `<div class="hero-meta">${heroMeta}</div>` : ''}
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Ключевые метрики · за 30 дней</div>
      <div class="metrics">${metrics}</div>
    </div>

    ${chartSection}
    ${bottomSection}
  </div>`;

  document.getElementById('cardHost').innerHTML = html;
  document.getElementById('cbEmpty').style.display = 'none';
  document.getElementById('cbStage').style.display = 'block';
  document.getElementById('cbActions').style.display = 'flex';
}

function mCard(label, value, sub){
  return `<div class="m-card"><div class="m-label">${label}</div><div class="m-value">${value}</div>${sub ? `<div class="m-sub">${sub}</div>` : ''}</div>`;
}
function kv(k, v){ return `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`; }

const BRAND_LOGO = `<svg class="brand-logo" viewBox="0 0 64 64" aria-label="StartupMarket">
    <defs>
      <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23242B"/><stop offset="1" stop-color="#15161A"/></linearGradient>
      <linearGradient id="smG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD535"/><stop offset="1" stop-color="#F0B90B"/></linearGradient>
    </defs>
    <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bgG)"/>
    <g transform="translate(14.080 39.793) scale(0.01063 -0.01063)" fill="url(#smG)">
      <path d="M71 485 502 512Q516 407 559 352Q629 263 759 263Q856 263 908.5 308.5Q961 354 961 414Q961 471 911 516Q861 561 679 601Q381 668 254 779Q126 890 126 1062Q126 1175 191.5 1275.5Q257 1376 388.5 1433.5Q520 1491 749 1491Q1030 1491 1177.5 1386.5Q1325 1282 1353 1054L926 1029Q909 1128 854.5 1173.0Q800 1218 704 1218Q625 1218 585.0 1184.5Q545 1151 545 1103Q545 1068 578 1040Q610 1011 730 986Q1027 922 1155.5 856.5Q1284 791 1342.5 694.0Q1401 597 1401 477Q1401 336 1323.0 217.0Q1245 98 1105.0 36.5Q965 -25 752 -25Q378 -25 234.0 119.0Q90 263 71 485Z"/>
      <path transform="translate(1438.0 0)" d="M145 1466H741L971 574L1200 1466H1794V0H1424V1118L1137 0H802L516 1118V0H145Z"/>
    </g>
  </svg>`;

/* ── Скачивание PNG ────────────────────────────────────────────────────── */
document.getElementById('cbDownload').addEventListener('click', async () => {
  const el = document.getElementById('cardPage');
  if (!el || typeof html2canvas === 'undefined') { setStatus('Библиотека экспорта не загрузилась.'); return; }
  const btn = document.getElementById('cbDownload');
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Готовлю PNG…';
  try {
    const canvas = await html2canvas(el, {
      scale: 3, useCORS: true, allowTaint: false, backgroundColor: '#17181C', logging: false,
    });
    const name = (document.querySelector('.hero-name')?.textContent || 'startup')
      .trim().toLowerCase().replace(/[^a-z0-9а-я]+/gi, '-').replace(/^-|-$/g, '') || 'startup';
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = 'startupmarket-' + name + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setStatus('PNG сохранён.');
  } catch (err) {
    setStatus('Не удалось создать PNG: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});

document.getElementById('cbReset').addEventListener('click', () => {
  document.getElementById('cardHost').innerHTML = '';
  document.getElementById('cbStage').style.display = 'none';
  document.getElementById('cbActions').style.display = 'none';
  document.getElementById('cbEmpty').style.display = 'block';
  input.value = ''; setStatus(indexDone ? INDEX.length + ' стартапов в поиске.' : ''); input.focus();
});

/* ── Автозагрузка по ?slug= (для прямых ссылок из админки) ──────────────── */
(function(){
  const q = new URLSearchParams(location.search);
  const slug = q.get('slug');
  if (slug) { input.value = slug; loadCard(slug); }
  buildIndex();
})();
</script>
