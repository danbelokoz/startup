// A metric is worth charting only if it has ≥2 points AND at least one non-zero
// reading. An all-zero series (e.g. a startup the source records but reports no
// subscriptions/MRR for) counts as "no data" - we show the notice rather than a
// pointless flat line at zero.
function seriesHasSignal(metric) {
  const pts = computePoints(metric, 'all').points;
  return pts.length >= 2 && pts.some(p => Number(p.val) !== 0);
}

// ── Chart controls (metric dropdown + period pills) ───────────────────────────
// Only metrics with real (non-zero) data are offered. Period pills are limited
// to windows that are smaller than the available data span.
function buildChartControls() {
  const metricSel = document.getElementById('chartMetricSel');
  const pills     = document.getElementById('chartPeriodPills');
  const filters   = document.querySelector('.chart-filters');
  if (!metricSel || !pills) return;

  const avail = _chartMetrics.filter(seriesHasSignal);
  if (!avail.length) { if (filters) filters.style.display = 'none'; metricSel.innerHTML = ''; pills.innerHTML = ''; return; }
  if (filters) filters.style.display = '';

  if (!avail.some(m => m.key === _chartMetric)) _chartMetric = avail[0].key;

  metricSel.innerHTML = avail.map(m =>
    `<option value="${m.key}"${m.key===_chartMetric?' selected':''}>${escHtml(metricLabel(m))}</option>`
  ).join('');

  buildPeriodPills();
}

// Render the period switcher as pill buttons (active = amber). Same data-driven
// option set as before; only windows shorter than the series span are offered.
function buildPeriodPills() {
  const pills  = document.getElementById('chartPeriodPills');
  const metric = _chartMetrics.find(m => m.key === _chartMetric);
  if (!pills || !metric) return;
  const { points } = computePoints(metric, 'all');
  let spanDays = 0;
  if (points.length >= 2) spanDays = Math.round((new Date(points[points.length-1].date) - new Date(points[0].date)) / 86400000);

  const suffix = t('startupPage','perDaySuffix') || 'd';
  const opts = CHART_PERIODS.filter(p => p < spanDays).map(p => ({ value: String(p), label: p + suffix }));
  // Always offer a 30-day view (the product default), even when the series is ~30d
  // or shorter - it then simply shows everything available.
  if (points.length && !opts.some(o => o.value === '30')) opts.unshift({ value: '30', label: '30' + suffix });
  opts.push({ value: 'all', label: t('startupPage','perAll') || 'All' });

  if (_chartPeriod !== 'all' && !opts.some(o => o.value === String(_chartPeriod))) _chartPeriod = 'all';
  pills.innerHTML = opts.map(o => {
    const active = String(_chartPeriod) === o.value;
    return `<button type="button" class="chart-pill${active?' active':''}" role="tab" aria-selected="${active}" onclick="onPeriodChange('${o.value}')">${escHtml(o.label)}</button>`;
  }).join('');
}

function onMetricChange(key) {
  _chartMetric = key;
  buildPeriodPills();   // available periods depend on the metric's data span
  renderChart();
}
function onPeriodChange(val) {
  _chartPeriod = (val === 'all') ? 'all' : parseInt(val, 10);
  buildPeriodPills();   // reflect the new active pill
  renderChart();
}

// Build the raw {date,val} series for a metric, optionally trimmed to last N days.
function computePoints(metric, period) {
  const s = _chartStartup || {};
  let points = [], stepped = false;

  if (metric.source === 'revenue-history') {
    points = (_revenueHistory || [])
      .map(p => ({ date: p.rev_date, val: p.rev_usd, charges: p.charges }))
      .filter(p => p.val != null);
  } else if (metric.source === 'price-history') {
    points = (_priceHistory || []).map(p => ({ date: (p.createdAt || '').slice(0, 10), val: p.price }));
    if (points.length && s.askingPrice != null) {
      const last = points[points.length - 1];
      const today = new Date().toISOString().slice(0, 10);
      if (last.date !== today) points.push({ date: today, val: s.askingPrice });
    }
    stepped = true;
  } else {
    points = _chartData.map(r => ({ date: r.snap_date, val: r[metric.key] })).filter(p => p.val != null);
    // Pin the latest point to the LIVE API value so the chart's "now" matches the
    // headline card. Snapshots are the SAME numbers (api/cron-refresh.js writes
    // Math.round(s.revenue.mrr) etc.) but captured only once a day by cron, so the
    // last snapshot can lag the live value. The API is the source of truth; the
    // snapshots only exist to give the chart a history (TrustMRR has no history API).
    const live = {
      mrr_cents:     s.revenue ? s.revenue.mrr : null,
      customers:     s.customers,
      subscriptions: s.activeSubscriptions,
      growth30d:     s.growth30d,
      visitors_30d:  s.visitorsLast30Days,
    }[metric.key];
    if (live != null && points.length) {
      const today = new Date().toISOString().slice(0, 10);
      const last = points[points.length - 1];
      if (last.date === today) last.val = live;        // refresh today's snapshot in place
      else points.push({ date: today, val: live });    // or append live as today's point
    }
  }

  // No projection fallback: when real data is missing (<2 points) we leave the
  // series empty so renderChart can show the "daily data not transmitted" notice
  // instead of a synthesised curve.

  // Trim to the selected period (skip for stepped price - changes are rare).
  // If the requested window holds no data - e.g. a delisted startup whose snapshots
  // stopped weeks ago - widen through the standard windows, up to the full history,
  // so we show the real (earlier) data instead of an empty/zero chart. widenedFrom
  // records the originally requested period so the UI can say "no data in the last N days".
  let widenedFrom = null;
  if (period && period !== 'all' && !stepped && points.length) {
    const dayMs = 86400_000;
    const within = days => {
      const cutoff = new Date(Date.now() - days * dayMs).toISOString().slice(0, 10);
      return points.filter(p => p.date >= cutoff);
    };
    let win = within(period);
    if (win.length < 2) {
      for (const d of [60, 90, 180, 365]) {
        const wider = within(d);
        if (wider.length >= 2) { win = wider; widenedFrom = period; break; }
      }
      if (win.length < 2) { win = points.slice(); widenedFrom = period; }   // fall back to full history
    }
    points = win;
  }

  return { points, stepped, widenedFrom };
}

// Header summary: SUM over the period for flow metrics (daily revenue), or the
// latest value for snapshots - plus % change vs the previous equal-length window.
function computeSummary(metric, period) {
  const all = computePoints(metric, 'all').points;
  if (!all.length) return null;
  const isFlow = !!metric.flow;   // revenue accumulates → show the total
  const sum = arr => arr.reduce((a, p) => a + (Number(p.val) || 0), 0);

  // basisDays: the window length to label the comparison with (e.g. "vs prev. 30d").
  // null = generic "vs prev. period" (used for the 'all' view and stale/widened windows).
  let curArr, prevArr, basisDays;
  if (period === 'all') {
    const mid = Math.floor(all.length / 2);
    curArr = all.slice(mid); prevArr = all.slice(0, mid);
    basisDays = null;
  } else {
    // Mirror the points the chart actually draws. computePoints applies the same
    // period window but falls back to the last N snapshots when the series is stale
    // (e.g. a delisted startup whose data stops weeks ago). Recomputing the window
    // by calendar date here instead made the header total disagree with the curve -
    // that's what produced "$0 / ↓100%" under a clearly non-zero line.
    const cp = computePoints(metric, period);
    curArr = cp.points;
    const n = curArr.length;
    const firstDrawn = n ? curArr[0].date : null;
    const idx = firstDrawn ? all.findIndex(p => p.date >= firstDrawn) : all.length;
    prevArr = idx > 0 ? all.slice(Math.max(0, idx - n), idx) : [];
    // When the window was widened past the requested period, "prev. N days" would be
    // misleading - the drawn window isn't N days. Label it generically instead.
    basisDays = cp.widenedFrom ? null : period;
  }

  let value, prev;
  if (isFlow) {
    value = sum(curArr); prev = sum(prevArr);
  } else {
    value = curArr.length ? Number(curArr[curArr.length - 1].val) || 0 : null;
    prev  = prevArr.length ? Number(prevArr[prevArr.length - 1].val) || 0
          : (curArr.length ? Number(curArr[0].val) || 0 : null);
  }

  let change = null;
  if (prev != null && prev !== 0 && value != null) change = (value - prev) / Math.abs(prev) * 100;
  return { value, isSum: isFlow, change, basisDays };
}

// The equal-length window immediately BEFORE the drawn window, as raw {date,val}
// points - used to overlay the "previous period" comparison line. Mirrors the
// prevArr logic in computeSummary. Returns [] when there's no clean prior window
// (the 'all' view, a stepped/stale series, or not enough earlier history).
function computePrevWindow(metric, period, curPoints, stepped, widenedFrom) {
  if (period === 'all' || stepped || widenedFrom || !curPoints || curPoints.length < 2) return [];
  const all = computePoints(metric, 'all').points;
  const n = curPoints.length;
  if (all.length < n + 2) return [];
  const idx = all.findIndex(p => p.date >= curPoints[0].date);
  if (idx <= 1) return [];
  const prev = all.slice(Math.max(0, idx - n), idx);
  return prev.length >= 2 ? prev : [];
}

// Localized "N payments" phrase. Russian keeps its 3-form plural; other languages
// use the single translated template "{n} payments".
function paymentsLine(n) {
  if (getLang() === 'ru') {
    const w = n % 10 === 1 && n % 100 !== 11 ? 'платёж'
            : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'платежа'
            : 'платежей';
    return n + ' ' + w;
  }
  return (t('startupPage','ttPayments') || '{n} payments').replace('{n}', n);
}

function renderChartHeader(metric, fmtFull) {
  const totalEl  = document.getElementById('chartTotal');
  const changeEl = document.getElementById('chartChange');
  if (!totalEl) return;
  const summary = computeSummary(metric, _chartPeriod);
  if (!summary || summary.value == null) {
    totalEl.textContent = '-';
    if (changeEl) { changeEl.textContent = ''; changeEl.className = 'chart-change'; }
    return;
  }
  totalEl.textContent = fmtFull(summary.value);
  if (changeEl) {
    if (summary.change == null || !isFinite(summary.change)) {
      changeEl.textContent = ''; changeEl.className = 'chart-change';
    } else {
      const up = summary.change >= 0;
      const basis = summary.basisDays
        ? (t('startupPage','vsPrevNDays') || 'vs prev. {n}d').replace('{n}', summary.basisDays)
        : (t('startupPage','vsPrevPeriod') || 'vs prev. period');
      changeEl.textContent = `${up ? '↑' : '↓'} ${Math.abs(summary.change).toFixed(0)}% ${basis}`;
      changeEl.className = 'chart-change ' + (up ? 'up' : 'down');
    }
  }
}

// Catmull-Rom → cubic-bezier smoothing for a soft, curved line.
function smoothPath(pts) {
  if (pts.length < 2) return '';
  if (pts.length === 2) return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} L${pts[1].x.toFixed(1)},${pts[1].y.toFixed(1)}`;
  const t = 0.16;
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1.x + (p2.x - p0.x) * t, c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t, c2y = p2.y - (p3.y - p1.y) * t;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

// Round axis bounds to human-friendly tick values (1/2/5 × 10ⁿ): 0, 500, 1K, 2K…
function niceTicks(min, max, count) {
  if (!isFinite(min) || !isFinite(max)) return { ticks: [0, 1], niceMin: 0, niceMax: 1, step: 1 };
  if (min === max) { if (min === 0) max = 1; else { min = Math.min(0, min); max = max * 1.1; } }
  const range = (max - min) || 1;
  const rawStep = range / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = niceMin; v <= niceMax + step * 0.5; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { ticks, niceMin, niceMax, step };
}

function renderChart() {
  const body = document.getElementById('chartBody');
  const rangeLabel = document.getElementById('chartRangeLabel');
  const legendEl = document.getElementById('chartLegend');
  if (!body) return;
  // A full re-render (metric/period switch, enrichment, auth) resets any brush.
  _chartSel = null; _chartDragging = false;
  { const _b = document.getElementById('chartBand'); if (_b) _b.style.opacity = '0'; }
  const metric = _chartMetrics.find(m => m.key === _chartMetric) || _chartMetrics[0];
  if (!metric) return;

  const { points, stepped, widenedFrom } = computePoints(metric, _chartPeriod);

  const fmt = (v) => {
    if (metric.kind === 'money') return formatMoney(v);   // money series are in whole USD
    if (metric.kind === 'pct') return (v >= 0 ? '+' : '') + parseFloat(v).toFixed(1) + '%';
    return Number(v).toLocaleString();
  };
  // Full-precision formatter for the header total and the hover tooltip
  const fmtFull = (v) => {
    if (v == null) return '-';
    if (metric.kind === 'money') return '$' + Math.round(v).toLocaleString();
    if (metric.kind === 'pct') return (v >= 0 ? '+' : '') + parseFloat(v).toFixed(1) + '%';
    return Number(Math.round(v)).toLocaleString();
  };

  // Header: period total (sum for revenue) + change vs previous window
  renderChartHeader(metric, fmtFull);

  if (points.length < 2 || !seriesHasSignal(metric)) {
    // No real daily series, or an all-zero one - say so honestly instead of
    // drawing a flat line at zero. Date the gap only when we held a real
    // non-zero reading at some point; otherwise stay generic.
    const dateStr = lastMeaningfulDataDate();
    let title;
    if (dateStr) {
      const human = new Date(dateStr).toLocaleDateString(getLang(), { year:'numeric', month:'long', day:'numeric' });
      title = (t('startupPage','chartNoDailySince') || 'Подневные данные не передаются с {date}').replace('{date}', human);
    } else {
      title = t('startupPage','chartNoDaily') || 'Подневные данные не передаются';
    }
    const note = t('startupPage','chartNoDailyNote') || 'Источник не присылает дневную разбивку по этому стартапу.';
    body.innerHTML = `<div class="chart-empty"><strong>${escHtml(title)}</strong><span>${escHtml(note)}</span></div>`;
    if (rangeLabel) rangeLabel.textContent = '';
    if (legendEl) legendEl.innerHTML = '';
    _chartGeom = null;
    hideChartHover();
    return;
  }

  // Previous equal-length window, overlaid as a faint dashed line for "this period
  // vs last period" context (index-aligned: day i of this window vs day i of the
  // prior one). Empty for the 'all' view, stepped price, or stale/short series.
  const prevPts = computePrevWindow(metric, _chartPeriod, points, stepped, widenedFrom);
  const hasPrev = prevPts.length >= 2;

  const W = 720, H = 220, PAD_L = 50, PAD_R = 12, PAD_T = 12, PAD_B = 26;
  const ys = points.map(p => Number(p.val) || 0);
  const prevYs = prevPts.map(p => Number(p.val) || 0);
  const yMinRaw = Math.min(...ys);   // current window only - drives the legend Min/Max
  const yMaxRaw = Math.max(...ys);
  // Axis must fit BOTH lines so the comparison is honest (a bigger prior period
  // shouldn't clip). Round to "nice" tick values; flow metrics anchor at 0.
  const yMinAll = hasPrev ? Math.min(yMinRaw, ...prevYs) : yMinRaw;
  const yMaxAll = hasPrev ? Math.max(yMaxRaw, ...prevYs) : yMaxRaw;
  const { ticks: yTicks, niceMin, niceMax } = niceTicks(metric.flow ? Math.min(0, yMinAll) : yMinAll, yMaxAll, 4);
  const yLo = niceMin;
  const yHi = niceMax > niceMin ? niceMax : niceMin + 1;
  const x = i => PAD_L + (i / Math.max(1, points.length - 1)) * (W - PAD_L - PAD_R);
  const y = v => H - PAD_B - ((v - yLo) / (yHi - yLo || 1)) * (H - PAD_T - PAD_B);
  // Previous line maps over its own length so it spans the full width and aligns
  // progress-wise with the current line.
  let prevLineD = '';
  if (hasPrev) {
    const xPrev = i => PAD_L + (i / Math.max(1, prevPts.length - 1)) * (W - PAD_L - PAD_R);
    prevLineD = smoothPath(prevPts.map((p, i) => ({ x: xPrev(i), y: y(Number(p.val) || 0) })));
  }

  // Build the line path: stepped for asking-price, smooth bezier for everything else
  const xy = points.map((p, i) => ({ x: x(i), y: y(ys[i]) }));
  const baseY = (H - PAD_B).toFixed(1);
  let lineD;
  if (stepped) {
    let d = `M${xy[0].x.toFixed(1)},${xy[0].y.toFixed(1)}`;
    for (let i = 1; i < xy.length; i++) d += ` L${xy[i].x.toFixed(1)},${xy[i-1].y.toFixed(1)} L${xy[i].x.toFixed(1)},${xy[i].y.toFixed(1)}`;
    lineD = d;
  } else {
    lineD = smoothPath(xy);
  }
  const areaD = `${lineD} L${xy[xy.length-1].x.toFixed(1)},${baseY} L${xy[0].x.toFixed(1)},${baseY} Z`;

  const gridLines = yTicks.filter(v => v >= yLo - 1e-6 && v <= yHi + 1e-6).map(v =>
    `<line x1="${PAD_L}" x2="${W-PAD_R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-dasharray="2 4"/>
     <text x="${PAD_L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text3)">${fmt(v)}</text>`
  ).join('');

  const xIdx = points.length >= 3 ? [0, Math.floor(points.length/2), points.length-1] : [0, points.length-1];
  const xLabels = xIdx.map(i => {
    const d = new Date(points[i].date);
    const lbl = d.toLocaleDateString(getLang(), { month: 'short', day: 'numeric' });
    return `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text3)">${lbl}</text>`;
  }).join('');

  const stroke = 'var(--accent)';
  const dash   = '';
  const fillGrad = 'url(#chartGrad)';

  body.innerHTML = `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="chartGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="chartGradMuted" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--text3)" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="var(--text3)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaD}" fill="${fillGrad}"/>
      ${prevLineD ? `<path d="${prevLineD}" fill="none" stroke="var(--text3)" stroke-width="1.4" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>` : ''}
      <path d="${lineD}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${dash}/>
      ${xLabels}
    </svg>`;

  // Cache geometry as container fractions (0..1) for the hover tooltip.
  // prev/prevDates carry the previous-period series so the tooltip can show the
  // matching figure for the hovered day (aligned by horizontal fraction).
  _chartGeom = {
    fmt, fmtFull, flow: !!metric.flow,
    prev: prevPts.map(p => Number(p.val) || 0),
    prevDates: prevPts.map(p => p.date),
    pts: points.map((p, i) => ({
      date: p.date, val: ys[i], charges: p.charges,
      cx: x(i) / W, cy: y(ys[i]) / H,
    })),
  };
  setupChartHover();
  hideChartHover();

  if (rangeLabel) {
    const range = points.length ? `${points[0].date} - ${points[points.length-1].date}` : '';
    if (widenedFrom) {
      const note = (t('startupPage','chartStaleNote') || 'Нет данных за последние {n} дн.').replace('{n}', widenedFrom);
      rangeLabel.innerHTML = `<span style="color:var(--text2);font-weight:500;">${note}</span> · ${range}`;
    }
    else rangeLabel.textContent = range;
  }

  if (legendEl) {
    const last = ys[ys.length - 1];
    const prevItem = hasPrev
      ? `<span class="chart-legend-item"><span class="chart-legend-swatch dashed"></span>${escHtml(t('startupPage','legPrevious'))}</span>`
      : '';
    legendEl.innerHTML =
      `<span class="chart-legend-item"><span class="chart-legend-swatch"></span>${escHtml(t('startupPage','legCurrent'))}</span>`
    + prevItem
    + `<span class="chart-legend-item">${escHtml(t('startupPage','legNow'))}: <b>${fmt(last)}</b></span>`
    + `<span class="chart-legend-item">${escHtml(t('startupPage','legMax'))}: <b>${fmt(yMaxRaw)}</b></span>`
    + `<span class="chart-legend-item">${escHtml(t('startupPage','legMin'))}: <b>${fmt(yMinRaw)}</b></span>`
    + `<span class="chart-legend-item" style="color:var(--text3)">${(t('startupPage','legPoints')||'{n} points').replace('{n}', points.length)}</span>`;
  }
}

// ── Chart hover (crosshair + per-day tooltip) ─────────────────────────────────
function setupChartHover() {
  // Bind per-element, not via a module flag: renderStartup re-renders (enrichment,
  // auth, reveal) rebuild #chartWrap, so a module-level guard would leave the
  // listener stuck on the old detached element and hover would silently die.
  const wrap = document.getElementById('chartWrap');
  if (!wrap || wrap._hoverBound) return;
  wrap._hoverBound = true;
  wrap.addEventListener('pointermove', onChartPointerMove);
  wrap.addEventListener('pointerleave', () => { if (!_chartDragging) hideChartHover(); });
  wrap.addEventListener('pointerdown', onChartDown);
  wrap.addEventListener('pointerup', onChartUp);
  wrap.addEventListener('pointercancel', onChartUp);
}

function onChartMove(e) {
  const geom = _chartGeom;
  const body = document.getElementById('chartBody');
  if (!geom || !geom.pts.length || !body) return;
  const rect = body.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if (!w || !h) return;
  const fx = (e.clientX - rect.left) / w;

  let best = 0, bd = Infinity;
  for (let i = 0; i < geom.pts.length; i++) {
    const d = Math.abs(geom.pts[i].cx - fx);
    if (d < bd) { bd = d; best = i; }
  }
  const p = geom.pts[best];
  const leftPx = p.cx * w, topPx = p.cy * h;

  const cross = document.getElementById('chartCross');
  const dot   = document.getElementById('chartDot');
  const tip   = document.getElementById('chartTip');
  if (cross) { cross.style.left = leftPx + 'px'; cross.style.opacity = '1'; }
  if (dot)   { dot.style.left = leftPx + 'px'; dot.style.top = topPx + 'px'; dot.style.opacity = '1'; }
  if (tip) {
    const dlbl = new Date(p.date).toLocaleDateString(getLang(), { day: 'numeric', month: 'short', year: 'numeric' });
    let rows = '';
    if (p.charges != null && p.charges > 0) {
      rows += `<span class="tt-row">${paymentsLine(p.charges)}</span>`;
      if (geom.flow) {
        // Average payment size (avg ticket) - a real signal for a buyer, so we keep
        // it but label it clearly instead of the cryptic "≈ $19 / платёж".
        const per = p.val / p.charges;
        rows += `<span class="tt-row">${(t('startupPage','ttAvgPayment') || 'Avg. payment: {v}').replace('{v}', formatMoney(per))}</span>`;
      }
    }
    // Matching previous-period value for this day (aligned by horizontal fraction,
    // mirroring how the dashed line is drawn) + the delta vs it.
    let prevRow = '';
    if (geom.prev && geom.prev.length) {
      const n = geom.pts.length;
      const pi = n > 1 ? Math.round(best / (n - 1) * (geom.prev.length - 1)) : 0;
      const pv = geom.prev[pi];
      if (pv != null) {
        let delta = '';
        if (pv !== 0 && p.val != null) {
          const dp = (p.val - pv) / Math.abs(pv) * 100;
          delta = ` <span class="tt-delta ${dp >= 0 ? 'up' : 'down'}">${dp >= 0 ? '↑' : '↓'} ${Math.abs(dp).toFixed(0)}%</span>`;
        }
        prevRow = `<span class="tt-row tt-prev">${t('startupPage','ttPrev') || 'Prev.'}: <b>${geom.fmtFull(pv)}</b>${delta}</span>`;
      }
    }
    tip.innerHTML = `<b>${geom.fmtFull(p.val)}</b>${rows}${prevRow}<span class="tt-date">${dlbl}</span>`;
    tip.style.left = Math.max(50, Math.min(w - 50, leftPx)) + 'px';
    tip.style.top = topPx + 'px';
    tip.style.opacity = '1';
  }
}

function hideChartHover() {
  ['chartCross','chartDot','chartTip'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.opacity = '0';
  });
}

// ── Chart range brush: press on a date and drag to select a span, then read the
//    change in the numbers over exactly that span (header total + % + days). ────
function chartNearestIdx(e) {
  const geom = _chartGeom, body = document.getElementById('chartBody');
  if (!geom || !geom.pts.length || !body) return -1;
  const rect = body.getBoundingClientRect();
  if (!rect.width) return -1;
  const fx = (e.clientX - rect.left) / rect.width;
  let best = 0, bd = Infinity;
  for (let i = 0; i < geom.pts.length; i++) { const d = Math.abs(geom.pts[i].cx - fx); if (d < bd) { bd = d; best = i; } }
  return best;
}
function onChartPointerMove(e) {
  if (_chartDragging) {
    const idx = chartNearestIdx(e); if (idx < 0) return;
    if (idx !== _chartAnchor) _chartMoved = true;
    _chartSel = { lo: Math.min(idx, _chartAnchor), hi: Math.max(idx, _chartAnchor) };
    updateChartBand(); refreshChartSummary();
    e.preventDefault();
  } else {
    onChartMove(e);   // plain hover: crosshair + per-day tooltip
  }
}
function onChartDown(e) {
  const idx = chartNearestIdx(e); if (idx < 0) return;
  _chartDragging = true; _chartMoved = false; _chartAnchor = idx;
  try { document.getElementById('chartWrap').setPointerCapture(e.pointerId); } catch (_) {}
  hideChartHover();
  _chartSel = { lo: idx, hi: idx };
  updateChartBand();
  e.preventDefault();
}
function onChartUp() {
  if (!_chartDragging) return;
  _chartDragging = false;
  // A tap with no drag (or a zero-width range) clears back to the period view.
  if (!_chartMoved || !_chartSel || _chartSel.hi === _chartSel.lo) { clearChartSel(); return; }
  refreshChartSummary();
}
function updateChartBand() {
  const band = document.getElementById('chartBand'), geom = _chartGeom;
  if (!band) return;
  if (!geom || !_chartSel) { band.style.opacity = '0'; return; }
  const lo = geom.pts[_chartSel.lo], hi = geom.pts[_chartSel.hi];
  if (!lo || !hi) { band.style.opacity = '0'; return; }
  band.style.left = (lo.cx * 100) + '%';
  band.style.width = ((hi.cx - lo.cx) * 100) + '%';
  band.style.opacity = '1';
}
// Change over the brushed span = the LEFT-edge day vs the RIGHT-edge day. We
// compare the two endpoints of the selection (not a running sum), so a spike
// that falls back reads as a drop - matching what the two highlighted days
// actually did. Same rule for every metric, incl. daily revenue.
function computeSelSummary() {
  const geom = _chartGeom; if (!geom || !_chartSel) return null;
  const pts = geom.pts, lo = _chartSel.lo, hi = _chartSel.hi;
  const cur = pts.slice(lo, hi + 1); if (!cur.length) return null;
  const start = Number(cur[0].val) || 0;
  const end   = Number(cur[cur.length - 1].val) || 0;
  let change = null;
  if (start !== 0) change = (end - start) / Math.abs(start) * 100;
  const days = Math.max(0, Math.round((Date.parse(cur[cur.length-1].date) - Date.parse(cur[0].date)) / 86400000));
  return { start, end, value: end, change, days, from: cur[0].date, to: cur[cur.length - 1].date };
}
function refreshChartSummary() {
  const geom = _chartGeom; if (!geom) return;
  const sum = computeSelSummary(); if (!sum) return;
  const totalEl  = document.getElementById('chartTotal');
  const changeEl = document.getElementById('chartChange');
  const rangeEl  = document.getElementById('chartRangeLabel');
  // Show the two endpoint values explicitly so it's clear we compare left vs right.
  if (totalEl) totalEl.textContent = `${geom.fmt(sum.start)} → ${geom.fmt(sum.end)}`;
  if (changeEl) {
    if (sum.change == null || !isFinite(sum.change)) { changeEl.textContent = ''; changeEl.className = 'chart-change'; }
    else {
      const up = sum.change >= 0;
      const dec = Math.abs(sum.change) < 10 && sum.change !== 0 ? 1 : 0;
      changeEl.textContent = `${up ? '↑' : '↓'} ${Math.abs(sum.change).toFixed(dec)}% · ${sum.days}${t('startupPage','perDaySuffix') || 'd'}`;
      changeEl.className = 'chart-change ' + (up ? 'up' : 'down');
    }
  }
  if (rangeEl) {
    const f = d => new Date(d).toLocaleDateString(getLang(), { day: 'numeric', month: 'short' });
    rangeEl.innerHTML = `<span class="chart-selrange">${f(sum.from)} – ${f(sum.to)}</span>`
      + `<button class="chart-reset" type="button" onclick="clearChartSel()" title="${escHtml(t('startupPage','reset') || 'Reset')}">✕</button>`;
  }
}
function clearChartSel() {
  _chartDragging = false; _chartMoved = false;
  renderChart();   // resets header/range to the dropdown period and hides the band
}

// ── Contact CTA - lives on the right side of the sale box ────────────────────
function renderContactSection(s) {
  const section = document.getElementById('contactSection');
  if (!section) return;
  // Registered users (free or paid) see the seller's site + founder directly.
  if (_revealed) {
    section.innerHTML = `<div class="contact-revealed" id="contactWrap" style="height:100%;">` +
      (s.website  ? `<a href="${escHtml(s.website)}" target="_blank" class="btn btn-primary btn-sm">${t('startupPage','viewOriginal')} ↗</a>` : '') +
      `</div>`;
    return;
  }
  // Guests: blurred placeholder + a free-registration call to action.
  const from = encodeURIComponent(location.pathname);
  section.innerHTML = `
    <div class="contact-cta" id="contactWrap" style="height:100%;">
      <span class="contact-cta-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <span class="contact-cta-text">
        <span class="contact-cta-title">${escHtml(t('startupPage','regGate'))}</span>
        <span class="contact-cta-sub">${escHtml(t('startupPage','regNote'))}</span>
      </span>
      <a class="btn btn-primary btn-sm" href="/auth.html?from=${from}">${escHtml(t('startupPage','regBtn'))}</a>
    </div>`;
}

function tryReveal() {
  // Site / founder / name are gated behind a free account. Logged-in users already
  // see everything (nothing to reveal); guests are sent to register for free.
  if (isAuthed()) { if (_startup) renderStartup(_startup); return; }
  location.href = '/auth.html?from=' + encodeURIComponent(location.pathname);
}

function doReveal(s) {
  try { sessionStorage.setItem('revealed_'+s.slug,'1'); } catch {}
  try { addRevealedSlug(s.slug); } catch {}   // persist across sessions + pages (home, leaderboard)
  _revealed = true;
  // Strip every paywall blur class in-place (no full re-render to keep chart state)
  document.querySelectorAll('.paywall-blur, .name-blur, .logo-blur, .owner-blur').forEach(el => {
    el.classList.remove('paywall-blur');
    el.classList.remove('name-blur');
    el.classList.remove('logo-blur');
    el.classList.remove('owner-blur');
  });
  // Drop the inline reveal pill if it's there
  document.querySelectorAll('.header-reveal').forEach(el => el.remove());
  // Re-render description so masked brand names appear in plain text
  renderStartup(s);
  const wrap = document.getElementById('contactWrap');
  if (wrap) {
    wrap.className = 'contact-revealed';
    wrap.innerHTML =
      (s.website ?`<a href="${escHtml(s.website)}" target="_blank" class="btn btn-primary btn-sm">${t('startupPage','viewOriginal')} ↗</a>`:'');
  }
}
// `tryReveal` is a top-level function declaration, so it is already exposed as
// window.tryReveal for the shared.js paywall CTA - do NOT reassign it here
// (a wrapper that calls tryReveal() would overwrite the global binding and
// recurse into itself → "Maximum call stack size exceeded").

function showLocked(type) {
  const from=encodeURIComponent(location.pathname);
  const wrap=document.getElementById('contactWrap'); if(!wrap)return;
  if (type==='user') {
    wrap.innerHTML=`<div class="contact-locked"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Создайте аккаунт - получите 8 просмотров в день</span><a href="/auth.html?from=${from}" class="btn btn-primary btn-sm">Зарегистрироваться</a></div>`;
  } else {
    wrap.innerHTML=`<div class="contact-locked"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Оформите подписку для безлимитного доступа</span><a href="/dashboard.html" class="btn btn-primary btn-sm">Подписаться</a></div>`;
  }
}

// ── Guest view tracking ───────────────────────────────────────────────────────
function getGuestViewedSlugs() { try{return JSON.parse(localStorage.getItem('sm_guest_views')||'[]');}catch{return[];} }
function addGuestViewedSlug(slug) {
  const list=getGuestViewedSlugs();
  if(!list.includes(slug)){list.push(slug);try{localStorage.setItem('sm_guest_views',JSON.stringify(list));}catch{}}
}

// Re-render contact section when auth resolves
// Auth resolves async after first paint. Re-render so the gate flips correctly:
// a logged-in user who first saw the blurred guest view now gets the full content
// (fetch guards in initChart/fetchEnrichment/fetchSiteData prevent duplicate requests).
window.addEventListener('navAuthUpdated', () => {
  try { localStorage.setItem('sm_authed', (window._access && window._access.authenticated) ? '1' : '0'); } catch {}
  if (_startup) renderStartup(_startup);
  updateFavBtn(_startup&&_startup.slug);
});
</script>
