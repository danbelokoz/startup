<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup — StartupMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <style>
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: 14px; text-decoration: none; padding: 8px 0; transition: color 0.15s; }
    .back-link:hover { color: var(--accent); }
    .page-wrap { max-width: 900px; margin: 0 auto; padding: 24px 24px 80px; }
    .startup-header { display: flex; align-items: flex-start; gap: 20px; margin: 24px 0 32px; }
    .startup-icon { width: 72px; height: 72px; border-radius: 16px; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; overflow: hidden; box-shadow: var(--shadow); }
    .startup-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
    .startup-header-meta h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
    .header-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .startup-desc { font-size: 16px; color: var(--text2); line-height: 1.7; margin-bottom: 32px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
    .metric-card-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .metric-card-value { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; }
    .metric-card-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
    .growth-positive { color: var(--green); }
    .growth-negative { color: var(--red); }
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 32px; background: var(--bg2); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .info-table tr { border-bottom: 1px solid var(--border); }
    .info-table tr:last-child { border-bottom: none; }
    .info-table td { padding: 12px 16px; font-size: 14px; }
    .info-table td:first-child { color: var(--text3); width: 40%; }
    .info-table td:last-child { font-weight: 500; }
    .sale-box { background: rgba(108,99,255,0.06); border: 1.5px solid rgba(108,99,255,0.25); border-radius: var(--radius); padding: 24px; margin-bottom: 32px; }
    .sale-box-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--accent); }
    .sale-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .sale-price { font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; }
    .sale-multiple { font-size: 16px; color: var(--text2); }
    .sale-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .not-sale-box { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 32px; text-align: center; color: var(--text2); }
    .loading-state { text-align: center; padding: 80px 24px; color: var(--text3); }
    .loading-state h3 { font-size: 18px; color: var(--text2); margin-bottom: 8px; }
    @media (max-width: 640px) { .page-wrap { padding: 16px 16px 60px; } .startup-header { flex-direction: column; } .startup-header-meta h1 { font-size: 24px; } .metrics-grid { grid-template-columns: 1fr 1fr; } .sale-price { font-size: 30px; } }
  .contact-locked { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .contact-locked svg { flex-shrink: 0; color: var(--text3); }
  .contact-locked span { flex: 1; font-size: 13px; color: var(--text2); }
  /* Blurred seller data */
  .contact-blur-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
  .contact-blur-inner { filter: blur(5px); user-select: none; pointer-events: none; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .contact-blur-item { font-size: 14px; color: var(--text2); margin-bottom: 4px; }
  .contact-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .contact-overlay-note { font-size: 11px; color: var(--text3); }
  /* Tech stack */
  .tech-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .tech-tag { padding: 4px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; color: var(--text2); }
  /* Fav button on detail page */
  .fav-detail { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 16px; color: var(--text3); transition: all 0.15s; font-family: 'Manrope', sans-serif; }
  .fav-detail:hover, .fav-detail.active { color: var(--red); border-color: var(--red); }
  .badge-green { background: rgba(0,194,122,0.1); color: var(--green); border: 1px solid rgba(0,194,122,0.2); }
  </style>
</head>
<body>
<div id="navPlaceholder"></div>
<div id="modalPlaceholder"></div>
<div class="page-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <a href="/" class="back-link" id="backLink">← Back</a>
    <button class="fav-detail" id="favBtn" onclick="toggleDetailFav()" title="Добавить в избранное">♡</button>
  </div>
  <div id="content"><div class="loading-state"><h3>Loading...</h3></div></div>
</div>
<footer><span id="footerText"></span> <a href="https://trustmrr.com" target="_blank">TrustMRR</a> · API v1</footer>

<script src="/auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/shared.js"></script>
<script>
function applyUI() {
  applyLangToDoc();
  document.getElementById('navPlaceholder').innerHTML = buildNavHTML('');
  document.getElementById('modalPlaceholder').innerHTML = buildModalHTML();
  document.getElementById('footerText').textContent = t('footer','data');
}

window.addEventListener('DOMContentLoaded', async () => {
  applyUI();
  initNavAuth();
  const slug = location.pathname.replace('/startup/','').replace('.html','');

  // 1. Try sessionStorage first (instant when navigating from catalog)
  try {
    const cached = sessionStorage.getItem('startup_detail');
    if (cached) {
      const s = JSON.parse(cached);
      if (s.slug === slug) { renderStartup(s); return; }
    }
  } catch(e) {}

  // 2. Try IndexedDB (works even if API is dead)
  const fromIdb = await idbGetOne(slug);
  if (fromIdb) { renderStartup(fromIdb); return; }

  // 3. Fall back to API
  loadStartup(slug);
});

async function loadStartup(slug) {
  if (!slug) slug = location.pathname.replace('/startup/','').replace('.html','');
  try {
    const res = await fetch(`/api/startup?slug=${encodeURIComponent(slug)}`);
    if (!res.ok) throw new Error('Not found');
    const { data } = await res.json();
    renderStartup(data);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="loading-state"><h3>⚠️ Not found</h3><p>${t('errors','load')}</p><a href="/" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">${t('startupPage','back')}</a></div>`;
  }
}

let _startup = null;
const LS_FAVS = 'sm_favs';
function getFavs(){try{return JSON.parse(localStorage.getItem(LS_FAVS)||'[]');}catch{return[];}}
function toggleDetailFav(){
  const s=_startup; if(!s)return;
  if(!window._access||!window._access.authenticated){location.href='/auth.html?from='+encodeURIComponent(location.pathname);return;}
  const favs=getFavs(),idx=favs.indexOf(s.slug);
  if(idx===-1)favs.push(s.slug);else favs.splice(idx,1);
  try{localStorage.setItem(LS_FAVS,JSON.stringify(favs));}catch{}
  const btn=document.getElementById('favBtn');
  if(btn){const on=favs.includes(s.slug);btn.textContent=on?'♥':'♡';btn.classList.toggle('active',on);}
}
function updateFavBtn(slug){
  const btn=document.getElementById('favBtn');if(!btn)return;
  const on=getFavs().includes(slug);btn.textContent=on?'♥':'♡';btn.classList.toggle('active',on);
}

function renderStartup(s) {
  document.title = `${s.name} — MRRket`;
  document.getElementById('backLink').textContent = '← ' + t('startupPage','back');
  _startup = s;
  updateFavBtn(s.slug);

  const fb = escHtml(s.name.charAt(0));
  const icon = s.icon ? `<img src="${escHtml(s.icon)}" data-fb="${fb}" onerror="this.parentElement.textContent=this.getAttribute('data-fb')"/>` : `<span>${fb}</span>`;
  const g    = s.growth30d;
  const gStr = g!=null?`<span class="${g>0?'growth-positive':g<0?'growth-negative':''}">${g>0?'+':''}${parseFloat(g).toFixed(1)}%</span>`:'—';
  const gMrr = s.growthMRR30d!=null?`<span class="${s.growthMRR30d>0?'growth-positive':s.growthMRR30d<0?'growth-negative':''}">${s.growthMRR30d>0?'+':''}${parseFloat(s.growthMRR30d).toFixed(1)}%</span>`:'—';
  const website = s.website?`<a href="${escHtml(s.website)}" target="_blank" style="color:var(--accent)">${s.website.replace(/^https?:\/\//,'')}</a>`:'—';

  // Tech stack
  const techHtml = s.techStack&&s.techStack.length
    ? `<div class="section-title">Tech Stack</div><div class="tech-tags">${s.techStack.map(t=>`<span class="tech-tag">${escHtml(t)}</span>`).join('')}</div>`
    : '';

  const saleBlock = s.onSale&&s.askingPrice ? `
    <div class="sale-box">
      <div class="sale-box-title">${t('startupPage','forSale')}</div>
      <div class="sale-price-row">
        <div class="sale-price">${formatMoney(s.askingPrice)}</div>
        ${s.multiple?`<div class="sale-multiple">${parseFloat(s.multiple).toFixed(2)}x ${t('startupPage','multiple')}</div>`:''}
      </div>
      <div id="contactSection"></div>
    </div>` : `<div class="not-sale-box">${t('startupPage','notForSale')}</div>`;

  document.getElementById('content').innerHTML = `
    <div class="startup-header">
      <div class="startup-icon">${icon}</div>
      <div class="startup-header-meta">
        <h1>${escHtml(s.name)}</h1>
        <div class="header-badges">
          ${s.category?`<span class="badge badge-cat">${s.category}</span>`:''}
          ${s.onSale?`<span class="badge badge-sale">${t('startupPage','forSale')}</span>`:''}
          ${s.paymentProvider?`<span class="badge badge-green">${s.paymentProvider}</span>`:''}
          ${s.rank?`<span class="badge badge-cat">#${s.rank}</span>`:''}
        </div>
        ${s.website?`<div style="font-size:14px;margin-top:4px;">${website}</div>`:''}
      </div>
    </div>

    ${s.description?`<div class="startup-desc">${escHtml(s.description)}</div>`:''}

    ${saleBlock}

    <div class="section-title">Revenue metrics</div>
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-card-label">${t('startupPage','mrr')}</div><div class="metric-card-value">${formatMoney(s.revenue&&s.revenue.mrr)}</div><div class="metric-card-sub">MRR growth: ${gMrr}</div></div>
      <div class="metric-card"><div class="metric-card-label">${t('startupPage','rev30')}</div><div class="metric-card-value">${formatMoney(s.revenue&&s.revenue.last30Days)}</div><div class="metric-card-sub">${t('startupPage','growth')}: ${gStr}</div></div>
      <div class="metric-card"><div class="metric-card-label">${t('startupPage','totalRev')}</div><div class="metric-card-value">${formatMoney(s.revenue&&s.revenue.total)}</div><div class="metric-card-sub">all time</div></div>
      ${s.profitMarginLast30Days!=null?`<div class="metric-card"><div class="metric-card-label">${t('startupPage','margin')}</div><div class="metric-card-value">${Math.round(s.profitMarginLast30Days)}%</div></div>`:''}
      <div class="metric-card"><div class="metric-card-label">${t('startupPage','customers')}</div><div class="metric-card-value">${(s.customers||0).toLocaleString()}</div></div>
      <div class="metric-card"><div class="metric-card-label">${t('startupPage','subs')}</div><div class="metric-card-value">${(s.activeSubscriptions||0).toLocaleString()}</div></div>
      ${s.visitorsLast30Days?`<div class="metric-card"><div class="metric-card-label">${t('startupPage','visitors')}</div><div class="metric-card-value">${s.visitorsLast30Days.toLocaleString()}</div></div>`:''}
      ${s.rank?`<div class="metric-card"><div class="metric-card-label">${t('startupPage','rank')}</div><div class="metric-card-value">#${s.rank}</div></div>`:''}
    </div>

    <div class="section-title">Info</div>
    <table class="info-table">
      ${s.foundedDate?`<tr><td>${t('startupPage','founded')}</td><td>${new Date(s.foundedDate).getFullYear()}</td></tr>`:''}
      ${s.country?`<tr><td>${t('startupPage','country')}</td><td>${s.country}</td></tr>`:''}
      ${s.targetAudience?`<tr><td>${t('startupPage','audience')}</td><td>${s.targetAudience.toUpperCase()}</td></tr>`:''}
      ${s.paymentProvider?`<tr><td>${t('startupPage','provider')}</td><td>${s.paymentProvider}</td></tr>`:''}
      ${s.website?`<tr><td>Website</td><td>${website}</td></tr>`:''}
    </table>

    ${techHtml}`;

  if (s.onSale) renderContactSection(s);
}

// ── Blurred seller contacts ──────────────────────────────────────────────────
function renderContactSection(s) {
  const section = document.getElementById('contactSection');
  if (!section) return;
  const xLine  = s.xHandle ? `<div class="contact-blur-item">𝕏 @${escHtml(s.xHandle)}</div>` : '';
  const webLine = s.website? `<div class="contact-blur-item">🌐 ${escHtml(s.website.replace(/^https?:\/\//,''))}</div>` : '';
  if (!xLine && !webLine) return;
  section.innerHTML = `
    <div class="contact-blur-wrap" id="contactWrap">
      <div class="contact-blur-inner">${xLine}${webLine}</div>
      <div class="contact-overlay">
        <button class="btn btn-primary" onclick="tryReveal()" id="revealBtn">🔓 Открыть контакты продавца</button>
        <div class="contact-overlay-note" id="revealNote">тратит 1 просмотр из вашего лимита</div>
      </div>
    </div>`;
  // If user already revealed this slug in this session, show immediately
  try { if (sessionStorage.getItem('revealed_'+s.slug)) { doReveal(s); } } catch {}
}

async function tryReveal() {
  const s = _startup; if (!s) return;
  const btn = document.getElementById('revealBtn');
  if (btn) { btn.textContent='⏳ Проверяем...'; btn.disabled=true; }

  const access = window._access;
  if (access && access.role==='subscriber') { doReveal(s); return; }

  if (access && access.authenticated) {
    const token = window._session&&window._session.access_token;
    if (!token) { doReveal(s); return; }
    try {
      const r = await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({slug:s.slug})});
      if (r.ok)            { doReveal(s); }
      else if (r.status===403){ showLocked('subscriber'); }
      else                 { doReveal(s); }
    } catch { doReveal(s); }
    return;
  }

  // Guest
  const viewed = getGuestViewedSlugs();
  if (viewed.includes(s.slug)||viewed.length<3) { addGuestViewedSlug(s.slug); doReveal(s); }
  else showLocked('user');
}

function doReveal(s) {
  try { sessionStorage.setItem('revealed_'+s.slug,'1'); } catch {}
  const wrap = document.getElementById('contactWrap'); if (!wrap) return;
  wrap.innerHTML =
    (s.xHandle?`<a href="https://x.com/${escHtml(s.xHandle)}" target="_blank" class="btn btn-primary" style="margin-right:8px;">𝕏 @${escHtml(s.xHandle)}</a>`:'') +
    (s.website ?`<a href="${escHtml(s.website)}" target="_blank" class="btn btn-ghost">${t('startupPage','viewOriginal')} ↗</a>`:'');
}

function showLocked(type) {
  const from=encodeURIComponent(location.pathname);
  const wrap=document.getElementById('contactWrap'); if(!wrap)return;
  if (type==='user') {
    wrap.innerHTML=`<div class="contact-locked"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Создайте аккаунт — получите 8 просмотров в день</span><a href="/auth.html?from=${from}" class="btn btn-primary btn-sm">Зарегистрироваться</a></div>`;
  } else {
    wrap.innerHTML=`<div class="contact-locked"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Оформите подписку для безлимитного доступа</span><a href="/dashboard.html" class="btn btn-primary btn-sm">Подписаться</a></div>`;
  }
}

// ── Guest view tracking ───────────────────────────────────────────────────────
function getGuestViewedSlugs() { try{return JSON.parse(localStorage.getItem('sm_guest_views')||'[]');}catch{return[];} }
function addGuestViewedSlug(slug) {
  const list=getGuestViewedSlugs();
  if(!list.includes(slug)){list.push(slug);try{localStorage.setItem('sm_guest_views',JSON.stringify(list));}catch{}}
}

// Re-render contact section when auth resolves
window.addEventListener('navAuthUpdated', () => { if (_startup&&_startup.onSale) renderContactSection(_startup); updateFavBtn(_startup&&_startup.slug); });
</script>
</body>
</html>
